    .site-nav .nav-menu a{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--gray);padding:.45rem .9rem;border:1px solid transparent;transition:color .18s,border-color .18s,background .18s;}
    .site-nav .nav-menu .nav-icon{display:block;width:16px;height:16px;background-color:#a8500a;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}

    .site-nav .nav-menu a.active{color:#fff;background:var(--orange);border-color:var(--orange);}

    box.classList.toggle('v', !!short); box.appendChild(f); modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  }
  function close(){ var f=box.querySelector('iframe'); if(f) f.remove(); modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
  document.querySelectorAll('.vid').forEach(function(b){ b.addEventListener('click', function(){ open(b.dataset.id, b.dataset.short==='1'); }); });
  document.getElementById('x').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  document.querySelectorAll('.chip').forEach(function(c){ c.addEventListener('click', function(){
    document.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x===c); });
    document.querySelectorAll('#vgrid .vid').forEach(function(v){ v.style.display = (c.dataset.f==='all' || v.dataset.cat===c.dataset.f) ? '' : 'none'; });
  }); });
})();
</script>
