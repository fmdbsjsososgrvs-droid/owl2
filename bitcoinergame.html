<html lang="ko" data-theme="light">
<head>
  <link rel="icon" type="image/jpeg" href="cq_imgs/cq_001.jpg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fdf4e7" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>THE BITCOINER GAME | OWL BUTLER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf4e7;
      --bg2: #faebd4;
      --bg3: #f5ddb8;
      --border: rgba(224,123,10,.18);
      --border2: rgba(224,123,10,.32);
      --accent: #e07b0a;
      --accent2: #c96c00;
      --accent-lt: #f5a623;
      --text: #1a1208;
      --text2: #7a6040;
      --text3: #a08060;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Inter', 'Noto Sans KR', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #fdf4e7; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* NAV (unified) */
    .site-nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:10px 5%;box-shadow:0 1px 12px rgba(224,123,10,.08);}
    .site-nav .nav-logo{font-family:var(--mono);font-weight:400;font-size:.8rem;letter-spacing:.22em;color:var(--text);text-decoration:none;text-transform:uppercase;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:4px 0;border:none;}
    .site-nav .nav-logo img{height:28px;width:28px;object-fit:cover;border-radius:3px;}
    .site-nav .nav-menu{display:flex;align-items:center;list-style:none;gap:.2rem;margin:0;padding:0;}
    .site-nav .nav-menu a{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--text2);padding:.45rem .9rem;border:1px solid transparent;transition:color .18s,border-color .18s,background .18s;}
    .site-nav .nav-menu img.nav-icon{height:16px;width:auto;vertical-align:middle;display:block;}
    .site-nav .nav-menu a:hover{color:var(--accent2);border-color:var(--border2);background:rgba(224,123,10,.06);}
    .site-nav .nav-menu a.active{color:#fff;background:var(--accent);border-color:var(--accent);}
    @media (max-width:700px){
      .site-nav{padding:8px 5%;}
      .site-nav .nav-menu{display:flex !important;flex-wrap:wrap;width:100%;border-top:1px solid var(--border);padding-top:6px;margin-top:4px;gap:0;}
      .site-nav .nav-menu a{padding:.4rem .65rem;font-size:.72rem;}
    }

    /* PAGE */
    .bg-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      position: relative;
      overflow: hidden;
    }
    .bg-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 20%, rgba(224,123,10,.10), transparent 60%),
        radial-gradient(ellipse 50% 35% at 80% 80%, rgba(116,64,201,.08), transparent 60%);
      pointer-events: none;
    }
    .bg-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 560px;
    }
    .bg-tag {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .35em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .bg-title {
      font-family: var(--mono);
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 14px;
    }
    .bg-title .hl { color: var(--accent); }
    .bg-sub {
      font-family: var(--sans);
      font-weight: 900;
      font-size: clamp(15px, 2.4vw, 19px);
      letter-spacing: .18em;
      color: #7440c9;
      margin-bottom: 44px;
    }
    .bg-desc {
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text2);
      line-height: 1.8;
      margin-bottom: 40px;
    }

    /* GLOWING LINK BUTTON */
    .glow-wrap {
      position: relative;
      display: inline-block;
      border-radius: 999px;
      isolation: isolate;
    }
    .glow-wrap::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      background: conic-gradient(from 0deg, #e07b0a, #f5a623, #7440c9, #ffce54, #e07b0a);
      filter: blur(16px);
      z-index: 0;
      animation: glow-spin 3.2s linear infinite, glow-pulse 2.1s ease-in-out infinite;
    }
    .glow-wrap::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: inherit;
      background: conic-gradient(from 0deg, #e07b0a, #f5a623, #7440c9, #ffce54, #e07b0a);
      z-index: 0;
      animation: glow-spin 3.2s linear infinite reverse;
      opacity: .9;
    }
    @keyframes glow-spin { to { transform: rotate(360deg); } }
    @keyframes glow-pulse {
      0%, 100% { opacity: .55; filter: blur(16px); }
      50%      { opacity: 1;   filter: blur(22px); }
    }
    .glow-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #1a1208;
      background: linear-gradient(135deg, #ffce54, var(--accent-lt) 45%, var(--accent) 100%);
      padding: 18px 40px;
      border-radius: 999px;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(224,123,10,.35);
      transition: transform .18s ease;
    }
    .glow-btn:hover { transform: translateY(-2px) scale(1.03); }
    .glow-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(115deg, transparent, rgba(255,255,255,.75), transparent);
      transform: skewX(-20deg);
      animation: glow-shine 2.4s ease-in-out infinite;
    }
    @keyframes glow-shine {
      0%   { left: -60%; }
      55%  { left: 130%; }
      100% { left: 130%; }
    }
    .bg-hint {
      margin-top: 22px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--text3);
    }

    /* FOOTER (unified) */
    body > footer.unified-footer{
      border-top:1px solid rgba(224,123,10,.18);
      max-width:1200px;
      margin:60px auto 0;
      padding:22px 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:transparent;
      box-sizing:border-box;
      text-align:center;
    }
    body > footer.unified-footer .uf-email{
      font-family:'Share Tech Mono',monospace;
      font-size:12px;
      color:#e07b0a;
      letter-spacing:.15em;
      text-align:center;
      width:100%;
    }
    body > footer.unified-footer .uf-note{
      font-family:'Share Tech Mono',monospace;
      font-size:11px;
      color:var(--text2);
      letter-spacing:.12em;
      text-align:center;
      width:100%;
    }
  </style>
</head>
