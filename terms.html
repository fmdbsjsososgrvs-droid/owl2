<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>OWL BUTLER | TERMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --bg2:#111; --bg3:#161616;
    --border:#1f1f1f; --border2:#2a2a2a;
    --text:#e0e0e0; --muted:#888;
    --accent:#f7931a;
    --mono:'Share Tech Mono',monospace;
    --sans:'Noto Sans KR',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}

  main.terms-main{max-width:1100px;margin:0 auto;padding:48px 24px 80px;}
  .page-label{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
  .page-title{font-family:var(--mono);font-size:clamp(26px,4vw,38px);letter-spacing:.12em;color:var(--text);margin-bottom:10px;}
  .page-title span{color:var(--accent);}
  .page-sub{font-size:15px;color:var(--text);line-height:1.8;margin-bottom:28px;}
  .page-sub em{color:var(--accent);font-style:normal;}

  /* Toolbar */
  .terms-toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:14px 16px;background:var(--bg2);border:1px solid var(--border);
    margin-bottom:32px;
  }
  .lang-toggle{display:flex;gap:0;flex-shrink:0;}
  .lang-btn{
    background:transparent;border:1px solid var(--accent);color:var(--accent);
    padding:8px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;
    cursor:pointer;transition:all .15s;
  }
  .lang-btn:first-child{border-right:none;}
  .lang-btn.active{background:var(--accent);color:#000;}
  .lang-btn:hover:not(.active){background:rgba(247,147,26,.1);}

  .search-wrap{flex:1;position:relative;min-width:180px;}
  .search-input{
    width:100%;padding:9px 14px 9px 36px;
    background:var(--bg);border:1px solid var(--border2);
    color:var(--text);font-family:var(--mono);font-size:13px;letter-spacing:.05em;
    outline:none;transition:border-color .15s;
  }
  .search-input::placeholder{color:var(--muted);letter-spacing:.1em;}
  .search-input:focus{border-color:var(--accent);}
  .search-icon{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--accent);font-size:16px;pointer-events:none;font-family:var(--mono);
  }
  .terms-count{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.15em;white-space:nowrap;flex-shrink:0;
  }

  /* Term list */
  .terms-list{display:flex;flex-direction:column;gap:36px;}
  .term-group{display:flex;flex-direction:column;}
  .term-group-head{
    font-family:var(--mono);font-size:18px;color:var(--accent);
    letter-spacing:.15em;padding-bottom:8px;
    border-bottom:1px solid var(--accent);margin-bottom:8px;
  }
  .term{
    display:flex;align-items:flex-start;gap:14px;
    padding:8px 0;border-bottom:1px dashed var(--border);
  }
  .term-btn{
    background:transparent;border:none;
    padding:6px 0;font-family:var(--mono);font-size:14px;
    color:var(--text);cursor:pointer;white-space:nowrap;flex-shrink:0;
    transition:all .15s;letter-spacing:.04em;text-align:left;
    min-width:160px;
  }
  .term-btn::before{content:'[ ';color:var(--accent);}
  .term-btn::after{content:' ]';color:var(--accent);}
  .term-btn .t-en{color:var(--accent);margin-left:6px;font-size:13px;font-weight:300;}
  .term-btn:hover{color:var(--accent);}
  .term.open .term-btn{color:var(--accent);}
  .term.open .term-btn::before,
  .term.open .term-btn::after{color:var(--text);}

  .term-desc{
    flex:1;display:none;padding:6px 0;
    font-size:14px;line-height:1.7;color:var(--text);
    font-family:var(--sans);font-weight:300;
  }
  .term.open .term-desc{display:block;}

  .no-results{
    text-align:center;padding:60px 24px;color:var(--muted);
    font-family:var(--mono);font-size:13px;letter-spacing:.15em;
  }

  @media(max-width:760px){
    main.terms-main{padding:32px 16px 60px;}
    .term{flex-direction:column;gap:6px;}
    .term-btn{min-width:0;width:auto;align-self:flex-start;}
    .term-desc{padding:0 0 4px 16px;border-left:2px solid var(--border2);}
  }
  @media(max-width:480px){
    .terms-toolbar{padding:10px;gap:8px;}
    .lang-btn{padding:7px 12px;font-size:11px;}
    .terms-count{width:100%;text-align:right;}
  }
</style>
<style id="unified-footer-style">
body > footer.unified-footer{
  border-top:1px solid #1f1f1f;max-width:1200px;margin:60px auto 0;
  padding:22px 24px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;background:transparent;
  box-sizing:border-box;text-align:center;
}
body > footer.unified-footer .uf-email{
  font-family:'Share Tech Mono',monospace;font-size:12px;
  color:#f7931a;letter-spacing:.15em;text-align:center;width:100%;
}
body > footer.unified-footer .uf-note{
  font-family:'Share Tech Mono',monospace;font-size:11px;
  color:#888;letter-spacing:.12em;text-align:center;width:100%;
}
</style>
<style id="unified-nav-style">
html{background:#0a0a0a;}
.site-header{position:fixed !important;top:0;left:0;right:0;z-index:1000;background:#0a0a0a;border-bottom:none !important;padding:0 !important;height:auto !important;}
.site-header .brand-row{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;justify-content:flex-start;align-items:center;position:relative;height:auto;}
.site-header .brand-row .logo{position:static !important;left:auto !important;display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
.site-header .brand-row .logo-img{width:42px !important;height:42px !important;object-fit:contain;opacity:.9;}
.site-header .brand-row .logo-text{display:flex !important;flex-direction:column !important;line-height:1.1 !important;}
.site-header .brand-row .logo-top{font-family:'Share Tech Mono',monospace !important;font-weight:700 !important;font-size:13px !important;color:#e0e0e0 !important;letter-spacing:.1em !important;line-height:1.3 !important;}
.site-header .brand-row .logo-bot{font-family:'Share Tech Mono',monospace !important;font-weight:700 !important;font-size:11px !important;color:#f7931a !important;letter-spacing:.1em !important;line-height:1.3 !important;}
.site-header .nav-bar{background:#000;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a;}
.site-header .main-nav{max-width:1200px;margin:0 auto;display:flex;justify-content:flex-start;position:relative;padding:0 12px;gap:0;flex-wrap:wrap;overflow-x:visible;scrollbar-width:none;-ms-overflow-style:none;}
.site-header .main-nav::-webkit-scrollbar{display:none;}
.site-header .nav-indicator{position:absolute;top:0;left:0;width:0;height:0;background:transparent !important;border:2px solid #f7931a !important;box-sizing:border-box;transition:none;z-index:1;pointer-events:none;opacity:0;}
.site-header .main-nav a{position:relative;z-index:2;font-family:'Noto Sans KR',sans-serif !important;font-size:13px !important;font-weight:700 !important;color:#f7931a !important;text-decoration:none !important;padding:16px 22px !important;letter-spacing:.04em !important;white-space:nowrap !important;border:none !important;background:none !important;display:inline-block !important;line-height:1.2 !important;}
.site-header .main-nav a:hover,.site-header .main-nav a.active{color:#f7931a !important;background:none !important;border:none !important;}
.site-header .main-nav a.nav-white,.site-header .main-nav a.nav-white:hover,.site-header .main-nav a.nav-white.active{color:#e0e0e0 !important;font-weight:400 !important;}
body{padding-top:124px;}
@media (max-width:768px){
  .site-header .brand-row{padding:10px 14px !important;}
  .site-header .main-nav{justify-content:flex-start !important;flex-wrap:wrap !important;overflow-x:visible !important;padding:4px 8px !important;}
  .site-header .main-nav a{padding:9px 10px !important;font-size:11px !important;letter-spacing:.03em !important;}
  body{padding-top:200px;}
}
</style>
</head>

const KO_INITIALS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KO_NORMALIZE = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const KO_ORDER = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ETC'];
const EN_ORDER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');

function koInit(s){
  const c = s.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3){
    const idx = Math.floor((c - 0xAC00) / 588);
    const ch = KO_INITIALS[idx];
    return KO_NORMALIZE[ch] || ch;
  }
  return 'ETC';
}
function enInit(s){
  const c = s.charCodeAt(0);
  if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) return s[0].toUpperCase();
  return '#';
}
function escHTML(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let currentView = 'ko';
let currentSearch = '';

function render(){
  const list = document.getElementById('termsList');
  const q = currentSearch.trim().toLowerCase();
  const filtered = TERMS.filter(t =>
    !q ||
    t.ko.toLowerCase().includes(q) ||
    t.en.toLowerCase().includes(q) ||
    t.desc.toLowerCase().includes(q)
  );

  const groups = {};
  if (currentView === 'ko'){
    filtered.forEach(t => {
      const k = koInit(t.ko);
      (groups[k] = groups[k] || []).push(t);
    });
    Object.values(groups).forEach(arr => arr.sort((a,b) => a.ko.localeCompare(b.ko, 'ko')));
  } else {
    filtered.forEach(t => {
      const k = enInit(t.en);
      (groups[k] = groups[k] || []).push(t);
    });
    Object.values(groups).forEach(arr => arr.sort((a,b) => a.en.localeCompare(b.en)));
  }

  const order = currentView === 'ko' ? KO_ORDER : EN_ORDER;
  let html = '';
  order.forEach(k => {
    if (!groups[k] || !groups[k].length) return;
    html += '<div class="term-group">';
    html += '<div class="term-group-head">' + escHTML(k) + '</div>';
    groups[k].forEach(t => {
      const sameLabel = t.ko === t.en;
      html += '<div class="term">' +
        '<button class="term-btn" type="button">' +
          '<span class="t-ko">' + escHTML(t.ko) + '</span>' +
          (sameLabel ? '' : '<span class="t-en">' + escHTML(t.en) + '</span>') +
        '</button>' +
        '<div class="term-desc">' + escHTML(t.desc) + '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  if (!filtered.length){
    html = '<div class="no-results">// NO RESULTS</div>';
  }

  list.innerHTML = html;
  list.querySelectorAll('.term-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.parentElement.classList.toggle('open'));
  });
  document.getElementById('termsCount').textContent = filtered.length + ' / ' + TERMS.length;
}

document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentView = b.dataset.lang;
    render();
  });
});
document.getElementById('termsSearch').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>

<script id="unified-nav-script">
(function(){
  var hdr=document.querySelector('.site-header');
  function syncPad(){if(hdr)document.body.style.paddingTop=hdr.offsetHeight+'px';}
  syncPad();
  window.addEventListener('load',syncPad);
  window.addEventListener('resize',syncPad);

  var nav=document.getElementById('mainNav');
  if(!nav)return;
  var ind=document.getElementById('navIndicator');
  var links=nav.querySelectorAll('a');
  var active=nav.querySelector('a.active');

  function setPos(el){
    if(!el){ind.style.opacity='0';return;}
    var inset=window.matchMedia('(max-width:768px)').matches?4:8;
    var x=el.offsetLeft+inset;
    var y=el.offsetTop+inset;
    var w=Math.max(el.offsetWidth-inset*2,0);
    var h=Math.max(el.offsetHeight-inset*2,0);
    ind.style.opacity='1';
    ind.style.width=w+'px';
    ind.style.height=h+'px';
    ind.style.transform='translate('+x+'px,'+y+'px)';
  }

  function init(){if(active)setPos(active);else ind.style.opacity='0';}
  if(document.readyState==='complete')init();else window.addEventListener('load',init);

  links.forEach(function(l){
    l.addEventListener('click',function(){setPos(l);});
  });
  window.addEventListener('resize',function(){if(active)setPos(active);});
})();
</script>
