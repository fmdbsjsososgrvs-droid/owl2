<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf4e7;
  --bg2: #faebd4;
  --border: rgba(224,123,10,.18);
  --border2: rgba(224,123,10,.32);
  --accent: #e07b0a;
  --accent2: #c96c00;
  --text: #1a1208;
  --text2: #7a6040;
  --text3: #a08060;
  --mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
}
.site-nav{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:10px 5%;box-shadow:0 1px 12px rgba(224,123,10,.08);}
.site-nav .nav-logo{font-family:var(--mono);font-weight:400;font-size:.8rem;letter-spacing:.22em;color:var(--text);text-decoration:none;text-transform:uppercase;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:4px 0;border:none;}
.site-nav .nav-logo img{height:28px;width:28px;object-fit:cover;border-radius:3px;}
.site-nav .nav-menu{display:flex;align-items:center;list-style:none;gap:3px;margin:0;padding:0;}
.site-nav .nav-menu li.nav-gap{margin-left:18px;position:relative;}.site-nav .nav-menu li.nav-gap::before{content:"|";position:absolute;left:-13px;top:50%;transform:translateY(-50%);color:#f0b25a;font-size:15px;line-height:1;font-family:'Share Tech Mono',monospace;}
.site-nav .nav-menu a{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--text2);padding:.45rem .9rem;border:1px solid transparent;transition:color .18s,border-color .18s,background .18s;}
.site-nav .nav-menu .nav-icon{display:block;width:16px;height:16px;background-color:#a8500a;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
.site-nav .nav-menu a:hover{color:var(--accent2);border-color:var(--border2);background:rgba(224,123,10,.06);}
.site-nav .nav-menu a.active{color:#fff;background:var(--accent);border-color:var(--accent);}
.site-nav .nav-menu a.active .nav-icon{background-color:#fff;}
@media (max-width:700px){
  .site-nav{padding:8px 5%;}
  .site-nav .nav-menu{display:flex !important;flex-wrap:wrap;width:100%;border-top:1px solid var(--border);padding-top:6px;margin-top:4px;gap:0;}
  .site-nav .nav-menu a{padding:.4rem .65rem;font-size:.72rem;}
}
.post-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 6% 100px;
}
.post-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-decoration: none;
  margin-bottom: 28px;
}
.post-back:hover { color: var(--accent2); }
.post-date {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.05em;
  color: var(--text3);
  margin-bottom: 10px;
}
.post-h1 {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.4;
  margin: 0 0 32px;
}
.post-body {
  font-size: 15.5px;
  line-height: 1.9;
  color: var(--text);
}
.post-body p { margin: 0 0 22px; }
.post-body h2 {
  font-size: 17px;
  font-weight: 700;
  margin: 40px 0 16px;
  padding-top: 4px;
}
.post-body blockquote {
  margin: 28px 0;
  padding: 4px 20px;
  border-left: 3px solid var(--accent);
  color: var(--text2);
  font-size: 14.5px;
}
.post-body ul, .post-body ol {
  margin: 0 0 22px;
  padding-left: 22px;
}
.post-body li { margin-bottom: 8px; }
.post-body img {
  width: 100%;
  border-radius: 8px;
  margin: 8px 0 28px;
  border: 1px solid var(--border);
}
.post-body a {
  color: var(--accent2);
  text-decoration: underline;
  text-decoration-color: var(--border2);
}
.post-body a:hover { color: var(--accent); }
.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.post-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--text2);
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 4px 12px;
}

.contact-form { display: flex; flex-direction: column; gap: 18px; margin-top: 8px; }
.contact-form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text); }
.contact-form .hint { font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: .04em; }
.contact-form input, .contact-form textarea {
  font: inherit; font-size: 15px; color: var(--text);
  background: #fffaf2; border: 1px solid var(--border2); border-radius: 8px;
  padding: 11px 13px; width: 100%;
}
.contact-form textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
.contact-form input:focus, .contact-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.contact-form .row-meta { display: flex; justify-content: space-between; align-items: center; }
.contact-form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.contact-form button {
  align-self: flex-start; font-family: var(--mono); font-size: 13px; letter-spacing: .14em;
  color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
  padding: 11px 26px; cursor: pointer;
}
.contact-form button:disabled { opacity: .55; cursor: default; }
.contact-status { font-size: 14px; min-height: 1.4em; margin: 0; }
.contact-status.ok { color: #2e7d32; }
.contact-status.err { color: #b3261e; }
.contact-note { font-size: 13px; color: var(--text2); line-height: 1.7; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
</style>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
</head>
<body>
<nav class="site-nav">
  <a class="nav-logo" href="index.html">
    <img loading="lazy" decoding="async" src="cq_imgs/cq_001.jpg" alt="mark" />OWL BUTLER
  </a>

    <li><a href="travel.html"><span class="nav-icon" style="-webkit-mask-image:url('icon/car.png');mask-image:url('icon/car.png');" role="img" aria-label="TRAVEL"></span></a></li>
    <li><a href="bitcoinblog.html"><span class="nav-icon" style="-webkit-mask-image:url('bitcoin.png');mask-image:url('bitcoin.png');" role="img" aria-label="BITCOINBLOG"></span></a></li>
    <li class="nav-gap"><a href="psbt.html"><span class="nav-icon" style="-webkit-mask-image:url('icon/folder.png');mask-image:url('icon/folder.png');" role="img" aria-label="PSBT"></span></a></li>
    <li><a href="vault2.html"><span class="nav-icon" style="-webkit-mask-image:url('icon/key-round.png');mask-image:url('icon/key-round.png');" role="img" aria-label="VAULT"></span></a></li>
    <li><a href="blockzero.html"><span class="nav-icon" style="-webkit-mask-image:url('icon/gamepad-2.png');mask-image:url('icon/gamepad-2.png');" role="img" aria-label="BLOCK ZERO"></span></a></li>
  </ul>
</nav>

<div class="post-wrap">
  <a class="post-back" href="index.html">← 홈으로</a>

  <h1 class="post-h1">연락하기</h1>

  <div class="post-body">
    <p>부엉집사에게 하고 싶은 말을 남겨주세요. 답장을 받고 싶다면 연락처를 적어주시면 됩니다.</p>

    <form class="contact-form" id="contactForm" novalidate>
      <label>
        이름 또는 닉네임 <span class="hint">선택 · 40자 이내</span>
        <input type="text" name="name" maxlength="40" autocomplete="nickname">
      </label>

      <label>
        답장 받을 연락처 <span class="hint">선택 · 이메일, 텔레그램 등 · 200자 이내</span>
        <input type="text" name="contact" maxlength="200" autocomplete="email">
      </label>

      <label>
        <span class="row-meta">메시지 <span class="hint"><span id="msgCount">0</span> / 2000</span></span>
        <textarea name="message" maxlength="2000" required></textarea>
      </label>

      <div class="hp" aria-hidden="true">
        <label>웹사이트 <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <button type="submit" id="contactSubmit">보내기</button>
      <p class="contact-status" id="contactStatus" role="status" aria-live="polite"></p>
    </form>

    <p class="contact-note">같은 곳에서는 하루에 3통까지 보낼 수 있어요. 보낸 메시지는 운영자에게만 전달되고 사이트에 공개되지 않습니다.</p>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('contactForm');
  var btn = document.getElementById('contactSubmit');
  var status = document.getElementById('contactStatus');
  var msg = form.elements.message;
  var count = document.getElementById('msgCount');

  msg.addEventListener('input', function () { count.textContent = msg.value.length; });

  function show(text, kind) {
    status.textContent = text;
    status.className = 'contact-status' + (kind ? ' ' + kind : '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var message = msg.value.trim();
    if (message.length < 5) return show('메시지를 5자 이상 적어주세요.', 'err');

    btn.disabled = true;
    show('보내는 중…');
    fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: form.elements.name.value,
        contact: form.elements.contact.value,
        message: message,
        website: form.elements.website.value
      })
    })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (data) {
        if (data.ok) {
          form.reset();
          count.textContent = '0';
          show('메시지를 보냈어요. 고마워요!', 'ok');
        } else {
          show(data.error || '전송에 실패했어요. 잠시 후 다시 시도해주세요.', 'err');
        }
      })
      .catch(function () { show('네트워크 오류로 보내지 못했어요.', 'err'); })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
