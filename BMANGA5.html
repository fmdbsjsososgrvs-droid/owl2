<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>부엉만화 5화 | OWL BUTLER</title>
  <style>
    :root{--bg:#fdf4e7;--bg2:#faebd4;--bg3:#f5e2c8;--border:rgba(224,123,10,.18);--accent:#e07b0a;--text:#1a1208;--text2:#7a6040;--text3:#a08060;--mono:'Share Tech Mono',monospace;--sans:'Noto Sans KR',sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
    a{text-decoration:none;}
    /* Manga */
    .manga-wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
    .manga-wrap img{width:100%;display:block;}
    /* Ending */
    .manga-ending{max-width:720px;margin:0 auto;padding:60px 24px;text-align:center;border-top:1px solid var(--border);}
    .ending-fin{font-family:var(--mono);font-size:15px;color:var(--accent);letter-spacing:0.4em;margin-bottom:36px;}
    .ending-body{padding-top:64px;font-family:var(--sans);font-size:14px;color:var(--text2);line-height:2.2;margin-bottom:36px;}
    .ending-sig{font-family:var(--mono);font-size:13px;color:var(--text3);letter-spacing:0.2em;}
    /* Buttons */
    .manga-btn-row{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:32px 0 64px;}
    .manga-btn{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:0.15em;padding:12px 28px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;text-decoration:none;transition:all 0.2s;}
    .manga-btn:hover{background:var(--accent);color:#000;}
    .manga-btn.back{border-color:var(--border);color:var(--text2);}
    .manga-btn.back:hover{background:var(--border);color:var(--text);}
  </style>
<style id="unified-footer-style">
body > footer.unified-footer{
  border-top:1px solid var(--border);
  max-width:1200px;
  margin:60px auto 0;
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:transparent;
  box-sizing:border-box;
  text-align:center;
}
body > footer.unified-footer .uf-email{
  font-family:'Share Tech Mono',monospace;
  font-size:12px;
  color:var(--accent);
  letter-spacing:.15em;
  text-align:center;
  width:100%;
}
body > footer.unified-footer .uf-note{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  color:var(--text3);
  letter-spacing:.12em;
  text-align:center;
  width:100%;
}
</style>
</head>
<body>

<div class="manga-wrap">
    <img src="manga5/a11.jpg" alt="1">
    <img src="manga5/a12.jpg" alt="2">
    <img src="manga5/a13.jpg" alt="3">
    <img src="manga5/a14.jpg" alt="4">
    <img src="manga5/a15.jpg" alt="5">
  </div>

  <div class="manga-ending">
    <p class="ending-fin">- E N D -</p>
    <p class="ending-body">
      이 만화는 부엉집사의 경험을 토대로 제작되었습니다.<br><br>
      인플레이션, 전쟁, 정부의 농간으로 고통받는 사람들.<br>
      그들을 향해 오늘도 건전화폐를 전파하는 모든 비트코이너에게 이 만화를 바칩니다.<br><br>
      my life for bitcoin
    </p>
    <p class="ending-sig">- owl butler</p>
  </div>

  <div class="manga-btn-row">
    <a class="manga-btn back" href="BMANGA4.html">← 이전화</a>
  </div>

<footer class="unified-footer">
  <span class="uf-email">⚡bitsexer@oksu.su</span>
  <span class="uf-note">NOT YOUR KEYS, NOT YOUR BITCOIN.</span>
</footer>
</body>
</html>
