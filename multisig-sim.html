<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멀티시그 시뮬레이터 | OWL BUTLER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  /* owlbutler 홈페이지와 같은 색 */
  --bg:#fdf4e7; --bg2:#faebd4; --bg3:#f5ddb8;
  --border:rgba(224,123,10,.18); --border2:rgba(224,123,10,.32);
  --accent:#e07b0a; --accent2:#c96c00; --accent-lt:#f5a623;
  --text:#1a1208; --text2:#7a6040; --text3:#a08060;
  --ok:#1b8a52; --bad:#c0392b;
  --ink:var(--text); --mut:var(--text2);
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:6px 4px 14px;margin-bottom:22px}
.top .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:17px}
.top .brand{font-family:var(--mono);letter-spacing:.32em;font-size:15px}
.chip{display:block;width:max-content;max-width:100%;margin:6px auto 14px;border:1px solid var(--border2);padding:6px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--accent);text-align:center}
h1{font-family:var(--mono);font-weight:400;font-size:30px;letter-spacing:.22em;margin:8px 0 6px;text-align:center;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
.rule{width:110px;height:2px;margin:0 auto 12px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.sub{color:var(--text2);font-size:13.5px;text-align:center;margin:0 0 12px}
.warn{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-size:13px;text-align:center;max-width:640px;margin:0 auto 16px;color:var(--text)}
.warn b{color:var(--accent2)}

/* mode + tabs */
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:3px}
.seg button{background:none;border:0;color:var(--text2);padding:6px 14px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
#tabs{display:none}

/* stage */
#stage{display:flex;gap:24px;justify-content:center;align-items:flex-start}
.slot{position:relative}
.slot .scaled{transform-origin:top left;position:absolute;left:0;top:0}
.label{text-align:center;font-family:var(--mono);font-size:13px;color:var(--text2);margin-bottom:8px;letter-spacing:.12em}
.dev{outline:0;transition:filter .2s}
.slot.active .dev{filter:drop-shadow(0 6px 18px rgba(224,123,10,.55))}
.slot:not(.active) .dev{opacity:.9;filter:drop-shadow(0 4px 10px rgba(26,18,8,.18))}

/* ---------- SeedSigner ---------- */
.ss{width:470px;height:330px;background:linear-gradient(145deg,#4a4e55,#2a2c30);border-radius:34px;position:relative;
  box-shadow:inset 0 2px 3px #fff3,0 14px 24px #0007}
.ss .screen{position:absolute;left:125px;top:41px;width:240px;height:248px}
.ss .screen .inner{width:240px;height:248px}
.ss .dpad{position:absolute;left:18px;top:106px;width:100px;height:100px;border-radius:50%;background:#1d1f22;box-shadow:inset 0 2px 6px #000}
.ss .dpad button{position:absolute;width:30px;height:30px;border:0;background:none;color:#9aa;font-size:16px;cursor:pointer}
.ss .dpad .u{left:35px;top:2px}.ss .dpad .d{left:35px;bottom:2px}.ss .dpad .l{left:2px;top:35px}.ss .dpad .r{right:2px;top:35px}
.ss .dpad .c{left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#222)}
.ss .keys{position:absolute;right:14px;top:70px;display:flex;flex-direction:column;gap:22px}
.ss .keys button{width:58px;height:34px;border-radius:17px;border:0;background:#1f2124;color:#aab;font-size:12px;cursor:pointer;box-shadow:inset 0 1px 3px #000,0 1px 0 #fff2}
.ss .screw{position:absolute;width:18px;height:18px;border-radius:50%;background:#15171a;box-shadow:inset 0 1px 2px #000}

/* ---------- Krux (Maix Amigo style) ---------- */
.kx{width:520px;height:350px;background:linear-gradient(145deg,#33363b,#1b1d20);border-radius:22px;position:relative;
  box-shadow:inset 0 2px 3px #fff2,0 14px 24px #0007}
.kx .screen{position:absolute;left:30px;top:24px;width:460px;height:302px;border-radius:6px;overflow:hidden;background:#000;border:3px solid #0a0a0a}
.kx .btn{position:absolute;right:6px;width:6px;height:36px;border-radius:3px;background:#111}
.kx .tag{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#777;letter-spacing:.3em}

/* ---------- Phone app ---------- */
.ph{width:300px;height:620px;background:#111;border-radius:42px;position:relative;padding:12px;box-shadow:inset 0 0 0 2px #444,0 14px 24px #0007}
.ph .screen{width:276px;height:596px;border-radius:32px;overflow:hidden;background:#f5f6f8;position:relative;color:#111}
.ph .notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:80px;height:20px;background:#111;border-radius:12px;z-index:3}

/* shared screen content */
.scr{width:100%;height:100%;display:flex;flex-direction:column;font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
/* seedsigner skin */
.ss .scr{background:#000;color:#fff;padding:8px 10px}
.ss .ttl{text-align:center;font-weight:700;font-size:20px;padding:4px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:38px}
.ss .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.ss .it{background:#262626;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:600;color:#ddd}
.ss .it .ic{font-size:30px;line-height:1}
.ss .it.sel{background:#ff9f0a;color:#111}
.ss .list{display:flex;flex-direction:column;gap:6px;flex:1;overflow:hidden}
.ss .list .it{flex-direction:row;justify-content:flex-start;padding:8px 12px;gap:10px;flex:0 0 auto;font-size:15px}
.ss .list .it .ic{font-size:18px}
.ss .body{font-size:14px;color:#ccc;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;padding:6px}
/* ss extras */
.ss .sub{font-size:12px;color:#bbb;text-align:center;line-height:1.5;margin-bottom:6px}
.ss .foot{font-size:10.5px;color:#ffb02e;text-align:center;padding-top:5px;line-height:1.3}
.ss .it.big{font-size:26px;font-weight:800;padding:14px 0}
.ss .scr .body{flex:0 1 auto;margin:8px 0;line-height:1.55}
.ss .scr .body~.list,.ss .scr .custom~.list{margin-top:auto}.ss .scr .list{flex:0 0 auto}
.body .bi{width:100%;overflow-wrap:anywhere;word-break:break-word}
.kx .ttl{position:relative}.kx .kback{position:absolute;left:0;top:3px;font-size:14px;color:#7be0a8;cursor:pointer;padding:3px 10px;border:1px solid #1f7a4d;border-radius:6px;background:#0c1f16}
.ap .row small{display:block;font-size:10.5px;color:#6b7783;margin-top:2px;font-weight:400}
.ap .mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;line-height:1.5;word-break:break-all;background:#f5f6f8;border:1px solid #e1e4ea;border-radius:8px;padding:8px;margin:6px 16px}
.ap .toast{position:absolute;left:14px;right:14px;bottom:72px;background:#0b2230;color:#fff;font-size:11.5px;padding:9px 12px;border-radius:10px;text-align:center;z-index:4}
/* entry */
.wi{width:100%;font-size:20px;background:#111;color:#fff;border:2px solid #ff9f0a;border-radius:8px;padding:8px;text-align:center;outline:0;margin:6px 0;font-family:ui-monospace,Menlo,monospace}
.kx .wi{border-color:#1f7a4d;font-size:24px}
.sg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:36px}
.sgw{background:#262626;color:#ddd;border-radius:8px;padding:6px 10px;font-size:15px;cursor:pointer}
.kx .sgw{font-size:18px;padding:8px 14px}
.sgn{color:#ff6b6b;font-size:13px}
.pw{margin-left:8px;background:#fff;border:1px solid var(--border2);color:var(--accent2);border-radius:8px;padding:2px 9px;font-family:var(--sans);font-size:11px;letter-spacing:0;cursor:pointer}.pw:hover{background:var(--bg3)}
#guide details{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px}
#guide summary{cursor:pointer;font-weight:700}
#guide .wl{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7;margin:6px 0;color:var(--accent2)}
#guide .gb{background:#fff;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;margin:2px 4px 2px 0}
#guide .gb.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
/* qr */
.aqr{text-align:center}.aqc{font-size:10.5px;color:#999;margin-top:3px}.ap .aqc{color:#556}
.qrw{display:flex;justify-content:center;align-items:center;flex:1}
.qr{border-radius:6px;display:block}
/* krux skin */
.kx .scr{background:#000;color:#fff;padding:8px 18px}
.kx .ttl{text-align:center;font-size:20px;padding:4px 0 10px;color:#fff;border-bottom:1px solid #333;margin-bottom:6px}
.kx .list{display:flex;flex-direction:column;flex:1;gap:2px}
.kx .it{padding:9px 14px;font-size:18px;color:#ddd;border-radius:4px;cursor:pointer}
.kx .it.sel{background:#1f7a4d;color:#fff}
.kx .sub{font-size:13px;color:#bbb;text-align:center;margin:2px 0 8px}
.kx .foot{font-size:12px;color:#ffb02e;text-align:center;padding-top:6px}
.kx .grid{display:grid;gap:8px;margin:6px 0}
.kx .grid .it{text-align:center;font-size:24px;font-weight:700;background:#222;padding:14px 0}
.kx .grid .it.sel{background:#1f7a4d}
.kx .wds{display:flex;gap:30px;justify-content:center;font-size:16px;color:#fff;margin:4px 0 6px;line-height:1.55}
.kx .wds .n{color:#888;display:inline-block;width:26px;text-align:right;margin-right:4px}
.kx .scr .body~.list{margin-top:auto}.kx .scr .list{flex:0 0 auto}
.kx .scr .body{flex:0 1 auto;margin:8px 0}
.kx .body{font-size:16px;color:#ccc;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;padding:6px}
/* app skin (watch-only coordinator, drawn from scratch) */
.ph .screen{background:#fff}
.ap{height:100%;display:flex;flex-direction:column;background:#fff;color:#0b2230;font-size:13px;position:relative}
.ap .sb{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0 28px;font-weight:700;font-size:12px;height:34px}
.ap .hd{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;min-height:40px}
.ap .hd .t{font-weight:800;font-size:15px;flex:1;text-align:center}
.ap .hd .ib{width:28px;font-size:18px;cursor:pointer;background:none;border:0;color:#0b2230;padding:0}
.ap .big{font-size:24px;font-weight:500;padding:6px 16px 0}
.ap .lead{padding:6px 16px 8px;font-size:13px}
.ap .main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.ap .wt{display:flex;gap:10px;padding:8px 16px;cursor:pointer;align-items:flex-start}
.ap .wt.off{opacity:.45;cursor:default}
.ap .wt .c{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.ap .wt b{display:block;font-weight:500;font-size:14px}
.ap .wt span{font-size:10.5px;color:#6b7783;line-height:1.3;display:block}
.ap .sep{height:6px;background:#f1f2f4;margin:6px 0}
.ap .row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e6e8eb;cursor:pointer;font-size:13.5px}
.ap .lab{display:flex;justify-content:space-between;padding:6px 16px 3px;font-weight:700;font-size:12px}
.ap .lab em{font-style:normal;color:#888;font-weight:400}
.ap input.nm{margin:0 16px;width:calc(100% - 32px);height:38px;border:1.5px solid #0b2230;border-radius:9px;padding:0 10px;font:inherit;font-size:14px;outline:0}
.ap .rd{display:flex;align-items:center;justify-content:space-between;margin:0 16px 4px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.ap .rd.on{background:#eaf1fd}
.ap .rd .p{border:1px solid #cfd5db;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700;margin-left:6px}
.ap .rd i{width:18px;height:18px;border-radius:50%;border:2px solid #0b2230;display:inline-block;position:relative}
.ap .rd.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#0b2230}
.ap .va{text-align:center;text-decoration:underline;font-size:12px;font-weight:600;padding:6px;cursor:pointer}
.ap .cta{margin:auto 16px 16px;height:42px;border-radius:21px;background:#0b2230;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;width:calc(100% - 32px)}
.ap .cta.dis{background:#e8e8e8;color:#777;cursor:default}
.ap .key{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer}
.ap .key .c{width:34px;height:34px;border-radius:50%;background:#f1f2f4;flex:none;display:flex;align-items:center;justify-content:center}
.ap .key .c::before{content:"";width:12px;height:17px;border:1.5px solid #0b2230;border-radius:3px;box-shadow:inset 0 5px 0 -3px #0b2230}
.ap .key .n{flex:1}.ap .key .n b{font-weight:500;font-size:14px;display:block}
.ap .tag{display:inline-block;background:#e9ebee;font-size:9px;font-weight:700;border-radius:7px;padding:1px 7px;margin:1px 0}
.ap .key .n small{display:block;color:#6b7783;font-size:10.5px}
.ap .cb{width:20px;height:20px;border:2px solid #0b2230;border-radius:3px;flex:none;position:relative}
.ap .cb.on{background:#0b2230}.ap .cb.on::after{content:"✓";color:#fff;position:absolute;left:2px;top:-3px;font-size:13px}
.ap .req{border-top:1px solid #dfe2e5;padding:10px 16px 4px}
.ap .req .r1{display:flex;align-items:center;justify-content:space-between}
.ap .req b{font-weight:500;font-size:14px;display:block}.ap .req small{font-size:10px;color:#6b7783;display:block;max-width:120px}
.ap .stp{display:flex;align-items:center;gap:8px}
.ap .stp button{width:30px;height:30px;border-radius:50%;border:2px solid #0b2230;background:#fff;font-size:17px;cursor:pointer;padding:0;line-height:1;color:#0b2230}

.ap .cfg span{background:#e9ebee;border-radius:12px;padding:3px 12px;font-weight:700;margin-left:6px}
.ap .rv{display:flex;justify-content:space-between;padding:6px 16px;font-size:13.5px}.ap .rv b{font-weight:700}
.ap .hr{height:1px;background:#e6e8eb;margin:6px 16px}
.ap .mk{font-weight:700;padding:8px 16px 2px;font-size:14px}
.ap .success{margin:auto;text-align:center;padding:0 24px 40px}

.ap .empty{margin:auto;text-align:center;color:#6b7783;padding:0 24px 80px;font-size:13px;line-height:1.6}
.ap .fab{position:absolute;right:16px;bottom:16px;height:42px;border-radius:21px;background:#0b2230;color:#fff;font-weight:700;padding:0 18px;display:flex;align-items:center;cursor:pointer;font-size:13px}


.ap .sb.dk{background:#05202e;color:#fff}
.ap .dhd{background:#05202e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 14px 12px}

.ap .vf{position:relative;margin:50px 20px 0;height:226px;background:#c3c7c3aa;border-radius:12px}
.ap .vf i{position:absolute;width:26px;height:26px;border:4px solid #fff}
.ap .vf .a{left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.ap .vf .b{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.ap .vf .c2{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}.ap .vf .d{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.ap .seen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.9}
.ap .simscan.low{top:auto;bottom:-22px;transform:translateX(-50%)}
.ap .nosig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.6;padding:0 16px}
.ap .nosig small{display:block;color:#ddd;font-size:9.5px;margin-top:6px}
.ap .simscan{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffb02e;color:#111;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.ap .simscan small{display:block;font-weight:500;font-size:9.5px;margin-top:3px}
.ap .pct{align-self:center;background:#0009;border-radius:5px;padding:2px 8px;font-size:12px;margin-top:70px}
.ap .cbtn{display:flex;gap:12px;justify-content:center;margin-top:20px}.ap .cbtn span{width:38px;height:38px;border-radius:50%;background:#fff;color:#0b2230;display:flex;align-items:center;justify-content:center}

/* guide */
#guide{margin:22px auto 0;max-width:920px;background:#fffaf1;border:1px solid var(--border2);border-radius:14px;padding:16px 18px;box-shadow:0 8px 24px rgba(224,123,10,.08)}
#guide h2{margin:0 0 4px;font-family:var(--mono);font-weight:400;font-size:17px;letter-spacing:.14em;color:var(--accent2)}
#guide .step{font-size:13px;color:var(--text2);margin:0 0 8px}
#guide .now{font-size:15px;line-height:1.65;margin:0 0 10px;color:var(--text)}
#guide .dice{background:rgba(224,123,10,.1);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px;color:var(--accent2)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--bg3)}
.dots i.done{background:var(--ok)}.dots i.cur{background:var(--accent)}
.nav{display:flex;gap:8px}
.nav button{background:#fff;border:1px solid var(--border2);color:var(--text);border-radius:9px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.nav button.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.cmp{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px;line-height:1.8}.cmp code{font-size:12px;color:var(--accent2)}.cmp b{display:block;color:var(--ok);margin-top:4px}
.finish{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px 16px;margin:0 0 16px;box-shadow:0 6px 18px rgba(224,123,10,.15)}
.finish .ft{font-family:var(--mono);font-size:17px;letter-spacing:.06em;color:var(--accent2);margin-bottom:2px}
.finish .fs{font-size:14px;color:var(--text2);margin-bottom:8px}
.finish ol{margin:0 0 8px;padding-left:22px;line-height:1.85;font-size:14.5px;color:var(--text)}
.finish ol li::marker{color:var(--accent);font-weight:700}
.finish .fn{background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text)}
.okb{background:#e6f4ea;color:#145c38;border:1px solid var(--ok);border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px}
.hint{font-size:12px;color:var(--text3);margin-top:10px}
@media (max-width:1180px){#tabs{display:inline-flex}}
</style>
</head>
<body>
<div class="wrap">
  <a class="top" href="index.html" style="text-decoration:none;color:inherit"><span class="logo">B</span><span class="brand">OWL BUTLER</span></a>
  <span class="chip">// MULTISIG PRACTICE LAB</span>
  <h1>MULTISIG <em>SIMULATOR</em></h1>
  <div class="rule"></div>
  <p class="sub">멀티시그 만들기·복원 연습 · 시드사이너 + 크록스 + 와치온리 앱(넌척) · 2-of-2</p>
  <div class="warn"><b>연습용 시뮬레이터예요.</b> 실제 자산을 보관하는 시드 문구는 입력하지 마세요.</div>

  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-m="make" class="on">만들기</button>
      <button data-m="restore">복원하기</button>
    </div>
    <div class="seg" id="tabs">
      <button data-d="ss" class="on">시드사이너</button>
      <button data-d="kx">크록스</button>
      <button data-d="app">앱(넌척)</button>
    </div>
  </div>

  <div id="stage">
    <div class="slot" id="slot-ss" data-d="ss">
      <div class="label">시드사이너 <button class="pw" onclick="powerCycle('ss')">⏻ 껐다 켜기</button></div>
      <div class="scaled">
        <div class="dev ss" tabindex="0" aria-label="시드사이너">
          <span class="screw" style="left:18px;top:18px"></span><span class="screw" style="right:18px;top:18px"></span>
          <span class="screw" style="left:18px;bottom:18px"></span><span class="screw" style="right:18px;bottom:18px"></span>
          <div class="screen"><div class="inner" id="scr-ss"></div></div>
          <div class="dpad">
            <button class="u" data-k="up" aria-label="위">▲</button><button class="d" data-k="down" aria-label="아래">▼</button>
            <button class="l" data-k="left" aria-label="왼쪽">◀</button><button class="r" data-k="right" aria-label="오른쪽">▶</button>
            <button class="c" data-k="ok" aria-label="선택"></button>
          </div>
          <div class="keys">
            <button data-k="back">KEY1</button><button data-k="home">KEY2</button><button data-k="ok">KEY3</button>
          </div>
        </div>
      </div>
    </div>

    <div class="slot" id="slot-app" data-d="app">
      <div class="label">와치온리 앱(넌척) <button class="pw" onclick="resetApp()">↺ 앱 재설치</button></div>
      <div class="scaled">
        <div class="dev ph" tabindex="0" aria-label="와치온리 앱">
          <div class="screen"><div class="notch"></div><div id="scr-app" style="height:100%"></div></div>
        </div>
      </div>
    </div>

    <div class="slot" id="slot-kx" data-d="kx">
      <div class="label">크록스 (Maix Amigo형) <button class="pw" onclick="powerCycle('kx')">⏻ 껐다 켜기</button></div>
      <div class="scaled">
        <div class="dev kx" tabindex="0" aria-label="크록스">
          <div class="screen"><div id="scr-kx" style="width:100%;height:100%"></div></div>
          <span class="btn" style="top:60px"></span><span class="btn" style="top:110px"></span>
          <span class="tag">KRUX</span>
        </div>
      </div>
    </div>
  </div>

  <div id="guide"></div>
</div>

function mountEntry(d){
  const inp=document.getElementById('wi-'+d),sg=document.getElementById('sg-'+d);if(!inp)return;
  const E=ENT[d];
  const draw=()=>{const v=inp.value.trim().toLowerCase(),l=sgList(v);
    sg.innerHTML=l.map(w=>`<span class="sgw" data-w="${w}">${w}</span>`).join('')||(v?'<span class="sgn">없는 단어예요</span>':'');
    sg.querySelectorAll('.sgw').forEach(n=>n.addEventListener('click',()=>acceptWord(d,n.dataset.w)));};
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim().toLowerCase(),l=sgList(v);
      if(BIP39.I[v]!==undefined)acceptWord(d,v);else if(l.length===1)acceptWord(d,l[0]);}
    else if(e.key==='Backspace'&&!inp.value&&E.words.length){e.preventDefault();E.words.pop();render(d);}
  });
  setTimeout(()=>{if(active===d)inp.focus();},0);draw();
}
function acceptWord(d,w){const E=ENT[d];E.words.push(w);if(E.words.length>=12)finishEntry(d);else render(d);}

async function finishEntry(d){
  const D=d==='ss'?SS:KX,words=[...ENT[d].words];
  swap(d,d==='ss'?'calc':'kcalc');
  if(!(window.crypto&&crypto.subtle)){D.entryErr='nocrypto';return swap(d,d==='ss'?'badsum':'kbad');}
  if(!(await mnemonicOk(words))){D.entryErr='sum';return swap(d,d==='ss'?'badsum':'kbad');}
  D.pendFp=await seedFingerprint(words);D.pendWords=words;
  swap(d,d==='ss'?'fpshow':'kfp');
}

    else if(a==='sigrun'){

      while(app.h.length>app.startLen)app.h.pop();
      app.s=app.h.pop();renderApp();onState();
    }
    else appGo(a);
  }));
}

/* ===== 상태 ===== */
const st={ss:{s:'home',i:0,h:[]},kx:{s:'home',i:0,h:[]},app:{s:'home',i:0,h:[]}};
let active='ss',mode='make';

function scr(d){const v=SCREENS[d][st[d].s];return typeof v==='function'?v():v;}
function render(d){
  if(d==='app')return renderApp();
  const s=scr(d),S=st[d],el=document.getElementById('scr-'+d);
  const sel=(k)=>S.i===k?' sel':'';
  let h='<div class="scr">';
  h+=`<div class="ttl">${d==='kx'&&S.h.length?'<span class="kback">‹ Back</span>':''}${s.back&&d==='ss'?'‹ ':''}${s.title}</div>`;
  if(s.sub)h+=`<div class="sub">${s.sub}</div>`;
  if(s.custom)h+=s.custom;
  if(s.body)h+=`<div class="body"><div class="bi">${s.body.replace(/\n/g,'<br>')}</div></div>`;
  if(s.items){
    h+=`<div class="${s.layout==='grid'?'grid':'list'}"${s.cols?` style="grid-template-columns:repeat(${s.cols},1fr)"`:''}>`;
    s.items.forEach((it,k)=>{
      h+=`<div class="it${sel(k)}${it.big?' big':''}" data-i="${k}">${it.ic?`<span class="ic">${it.ic}</span>`:''}<span>${it.label}</span></div>`;
    });
    h+='</div>';
  }
  if(s.foot)h+=`<div class="foot">${s.foot}</div>`;
  h+='</div>';
  el.innerHTML=h;
  aqUpdate();
  if(s.mount)s.mount();
  const kb=el.querySelector('.kback');if(kb)kb.addEventListener('click',()=>{setActive(d);back(d);});
  el.querySelectorAll('.it').forEach(n=>n.addEventListener('click',()=>{
    if(d==='ss')return;               // 시드사이너는 방향키로만 조작
    S.i=+n.dataset.i;setActive(d);press(d,'ok');
  }));
}
function go(d,to){const S=st[d];S.h.push([S.s,S.i]);S.s=to;S.i=0;render(d);}
function back(d){const S=st[d];if(!S.h.length)return;const e=S.h.pop();const [s,i]=Array.isArray(e)?e:[e,0];S.s=s;S.i=i;render(d);}
function press(d,k){
  if(d==='app'){ if(k==='back')appBack(); else if(k==='home'){app.s='home';app.h=[];renderApp();} return; }
  const S=st[d],s=scr(d),items=s.items||[];
  if(k==='back'||(k==='left'&&!(s.layout==='grid'))){ if(s.back||S.h.length){back(d);return;} }
  if(k==='home'){S.s='home';S.i=0;S.h=[];render(d);return;}
  if(k==='ok'){
    if(!items.length){ if(s.back)back(d); return; }
    const it=items[S.i]; if(it&&it.fn)it.fn(); else if(it&&it.to)go(d,it.to); return;
  }
  if(!items.length)return;
  const n=items.length;
  if(s.layout==='grid'){
    const W=s.cols||2;
    let r=Math.floor(S.i/W),c=S.i%W;
    if(k==='left')c=Math.max(0,c-1);
    if(k==='right')c=Math.min(W-1,c+1);
    if(k==='up')r=Math.max(0,r-1);
    if(k==='down')r=Math.min(Math.ceil(n/W)-1,r+1);
    S.i=Math.min(n-1,r*W+c);
  }else{
    if(k==='up')S.i=(S.i-1+n)%n;
    if(k==='down')S.i=(S.i+1)%n;
  }
  render(d);
}

/* ===== 활성 기기 / 입력 ===== */
function setActive(d){
  active=d;
  document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('active',s.dataset.d===d));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  if(narrow())layout();
}
document.querySelectorAll('.slot').forEach(s=>s.addEventListener('pointerdown',()=>{ if(!narrow())setActive(s.dataset.d); }));
document.querySelectorAll('.ss [data-k]').forEach(b=>b.addEventListener('click',e=>{setActive('ss');press('ss',b.dataset.k);}));
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==='INPUT')return;
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Backspace:'back',Escape:'home'};
  if(e.key==='1'||e.key==='2'||e.key==='3'){setActive(['ss','kx','app'][+e.key-1]);return;}
  if(e.target.tagName==='INPUT')return;   // 앱 이름 입력 중에는 단축키 끄기
  const k=map[e.key]; if(!k)return;
  e.preventDefault(); press(active,k);
});

/* ===== 반응형 배치 ===== */
function narrow(){return document.documentElement.clientWidth<=1180;}
function layout(){
  const stage=document.getElementById('stage');
  const w=Math.min(document.querySelector('.wrap').clientWidth-32,1400);
  const order=['ss','app','kx'];
  if(narrow()){
    order.forEach(d=>document.getElementById('slot-'+d).style.display=d===active?'block':'none');
    fit(active,Math.min(1,w/SIZE[active][0]));
  }else{
    const gap=24,total=SIZE.ss[0]+SIZE.app[0]+SIZE.kx[0]+gap*2;
    const s=Math.min(1,w/total);
    order.forEach(d=>{document.getElementById('slot-'+d).style.display='block';fit(d,s);});
  }
}
function fit(d,s){
  const slot=document.getElementById('slot-'+d),sc=slot.querySelector('.scaled');
  sc.style.transform=`scale(${s})`;
  slot.style.width=SIZE[d][0]*s+'px';
  sc.style.position='relative';
  slot.style.height='auto';
  sc.style.height=SIZE[d][1]+'px';sc.style.width=SIZE[d][0]+'px';
  slot.querySelector('.scaled').style.marginBottom=(SIZE[d][1]*s-SIZE[d][1])+'px';
  sc.style.marginRight=(SIZE[d][0]*s-SIZE[d][0])+'px';
}
window.addEventListener('resize',layout);
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setActive(b.dataset.d)));
