<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCK ZERO | OWL BUTLER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #fdf4e7;
  --bg2: #faebd4;
  --border: rgba(224,123,10,.18);
  --border2: rgba(224,123,10,.32);
  --accent: #e07b0a;
  --accent2: #c96c00;
  --text: #1a1208;
  --text2: #7a6040;
  --text3: #a08060;
  --mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
}
.site-nav{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:10px 5%;box-shadow:0 1px 12px rgba(224,123,10,.08);}
.site-nav .nav-logo{font-family:var(--mono);font-weight:400;font-size:.8rem;letter-spacing:.22em;color:var(--text);text-decoration:none;text-transform:uppercase;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:4px 0;border:none;}
.site-nav .nav-logo img{height:28px;width:28px;object-fit:cover;border-radius:3px;}
.site-nav .nav-menu{display:flex;align-items:center;list-style:none;gap:3px;margin:0;padding:0;}
.site-nav .nav-menu li.nav-gap{margin-left:18px;position:relative;}.site-nav .nav-menu li.nav-gap::before{content:"|";position:absolute;left:-13px;top:50%;transform:translateY(-50%);color:#f0b25a;font-size:15px;line-height:1;font-family:'Share Tech Mono',monospace;}
.site-nav .nav-menu a{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--text2);padding:.45rem .9rem;border:1px solid transparent;transition:color .18s,border-color .18s,background .18s;}
.site-nav .nav-menu .nav-icon{display:block;width:16px;height:16px;background-color:#a8500a;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
.site-nav .nav-menu a:hover{color:var(--accent2);border-color:var(--border2);background:rgba(224,123,10,.06);}
.site-nav .nav-menu a.active{color:#fff;background:var(--accent);border-color:var(--accent);}
.site-nav .nav-menu a.active .nav-icon{background-color:#fff;}
@media (max-width:700px){
  .site-nav{padding:8px 5%;}
  .site-nav .nav-menu{display:flex !important;flex-wrap:wrap;width:100%;border-top:1px solid var(--border);padding-top:6px;margin-top:4px;gap:0;}
  .site-nav .nav-menu a{padding:.4rem .65rem;font-size:.72rem;}
}
.bz-hero {
  max-width: 860px;
  margin: 0 auto;
  padding: 96px 5% 120px;
  text-align: center;
}
.bz-hero.has-next { padding-bottom: 56px; }
.bz-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.bz-title {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 56px;
  letter-spacing: 0.1em;
  line-height: 1.1;
  margin: 0 0 44px;
}
.bz-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}
.bz-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 200px;
  padding: 15px 28px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: background .18s, color .18s, border-color .18s, box-shadow .18s;
}
.bz-btn.primary {
  background: var(--accent);
  color: #fff;
}
.bz-btn.primary:hover {
  background: var(--accent2);
  border-color: var(--accent2);
  box-shadow: 0 4px 16px rgba(224,123,10,.28);
}
.bz-btn.secondary {
  background: #fff;
  color: var(--accent2);
  border-color: var(--border2);
}
.bz-btn.secondary:hover {
  border-color: var(--accent);
  background: rgba(224,123,10,.06);
}
.bz-btn:focus-visible {
  outline: 3px solid rgba(224,123,10,.35);
  outline-offset: 2px;
}
@media (max-width:520px) {
  .bz-hero { padding: 64px 5% 80px; }
  .bz-title { font-size: 38px; margin-bottom: 32px; }
  .bz-btn { width: 100%; }
}

/* 비트코이너 키우기 — 귀여운 카드 */
.bk-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 5% 100px;
  text-align: center;
}
.bk-card {
  position: relative;
  display: inline-block;
  width: 100%;
  max-width: 520px;
  padding: 44px 28px 40px;
  background: #fff8ec;
  border: 2.5px dashed var(--accent);
  border-radius: 32px;
  box-shadow: 0 8px 0 rgba(224,123,10,.14);
}
.bk-chip {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 16px;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .2em;
}
.bk-emoji {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 8px;
  display: inline-block;
  animation: bk-bob 2.4s ease-in-out infinite;
}
.bk-title {
  font-family: 'Jua', 'IBM Plex Sans KR', sans-serif;
  font-weight: 400;
  font-size: 38px;
  line-height: 1.25;
  letter-spacing: .02em;
  color: var(--accent2);
  margin: 0 0 6px;
}
.bk-sub {
  font-family: 'Jua', 'IBM Plex Sans KR', sans-serif;
  font-size: 16px;
  color: var(--text2);
  margin: 0 0 26px;
}
.bk-play {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 180px;
  padding: 14px 34px;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  border: 0;
  box-shadow: 0 5px 0 var(--accent2);
  font-family: 'Jua', 'IBM Plex Sans KR', sans-serif;
  font-size: 22px;
  letter-spacing: .08em;
  text-decoration: none;
  transition: transform .12s, box-shadow .12s;
}
.bk-play:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent2); }
.bk-play:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent2); }
.bk-play:focus-visible { outline: 3px solid rgba(224,123,10,.35); outline-offset: 3px; }
@keyframes bk-bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .bk-emoji { animation: none; } }
@media (max-width:520px) {
  .bk-card { padding: 40px 20px 34px; }
  .bk-title { font-size: 30px; }
  .bk-play { width: 100%; }
}

/* BLOCK ZERO — 블록 프레임 */
.bz-card {
  position: relative;
  display: inline-block;
  width: 100%;
  max-width: 520px;
  padding: 48px 28px 44px;
  background:
    linear-gradient(rgba(224,123,10,.07) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(224,123,10,.07) 1px, transparent 1px) 0 0 / 24px 24px,
    #fffaf1;
  border: 4px solid var(--text);
  border-radius: 0;
  box-shadow: 10px 10px 0 var(--accent);
}
.bz-card::before, .bz-card::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border: 3px solid var(--text);
}
.bz-card::before { top: -11px; left: -11px; }
.bz-card::after { bottom: -11px; right: -11px; }
.bz-card .bz-title { margin-bottom: 34px; }
@media (max-width:520px) {
  .bz-card { padding: 40px 18px 36px; box-shadow: 7px 7px 0 var(--accent); }
}
</style>
