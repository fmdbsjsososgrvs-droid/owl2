<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>부엉만화 1화 | OWL BUTLER</title>
  <style>
    :root{--bg:#fdf4e7;--bg2:#faebd4;--bg3:#f5e2c8;--border:rgba(224,123,10,.18);--accent:#e07b0a;--text:#1a1208;--text2:#7a6040;--text3:#a08060;--mono:'Share Tech Mono',monospace;--sans:'Noto Sans KR',sans-serif;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
    a{text-decoration:none;}
    /* Manga */
    .manga-wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
    .manga-wrap img{width:100%;display:block;}
    /* Buttons */
    .manga-btn-row{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:32px 0 64px;}
    .manga-btn{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:0.15em;padding:12px 28px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;text-decoration:none;transition:all 0.2s;}
    .manga-btn:hover{background:var(--accent);color:#000;}
    .manga-btn.back{border-color:var(--border);color:var(--text2);}
    .manga-btn.back:hover{background:var(--border);color:var(--text);}
  </style>
<style id="unified-footer-style">
body > footer.unified-footer{
  border-top:1px solid var(--border);
  max-width:1200px;
  margin:60px auto 0;
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:transparent;
  box-sizing:border-box;
  text-align:center;
}
body > footer.unified-footer .uf-email{
  font-family:'Share Tech Mono',monospace;
  font-size:12px;
  color:var(--accent);
  letter-spacing:.15em;
  text-align:center;
  width:100%;
}
body > footer.unified-footer .uf-note{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;
  color:var(--text3);
  letter-spacing:.12em;
  text-align:center;
  width:100%;
}
</style>
</head>
<body>

<div class="manga-wrap">
    <img src="manga/a111.jpg" alt="1">
    <img src="manga/a112.jpg" alt="2">
    <img src="manga/a113.jpg" alt="3">
    <img src="manga/a114.jpg" alt="4">
    <img src="manga/a116.jpg" alt="5">
    <img src="manga/a117.jpg" alt="6">
    <img src="manga/a118.jpg" alt="7">
  </div>

  <div class="manga-btn-row">
    <a class="manga-btn" href="BMANGA2.html">다음화 보기 →</a>
  </div>

<footer class="unified-footer">
  <span class="uf-email">⚡bitsexer@oksu.su</span>
  <span class="uf-note">NOT YOUR KEYS, NOT YOUR BITCOIN.</span>
</footer>
</body>
</html>
