<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>HALVING STANDBY | OWL BUTLER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
  }
  .frame {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 100vw; max-height: 100vh;
    background: radial-gradient(120% 140% at 50% 0%, #141414 0%, #060606 60%, #020202 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid rgba(255,176,32,.35);
    overflow: hidden;
  }
  .bolt {
    position: absolute; width: clamp(8px,2vw,14px); height: clamp(8px,2vw,14px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #444, #111 70%);
    border: 1px solid rgba(255,255,255,.12);
  }
  .bolt.tl { top: clamp(6px,2vh,16px); left: clamp(6px,2vw,16px); }
  .bolt.tr { top: clamp(6px,2vh,16px); right: clamp(6px,2vw,16px); }
  .bolt.bl { bottom: clamp(6px,2vh,16px); left: clamp(6px,2vw,16px); }
  .bolt.br { bottom: clamp(6px,2vh,16px); right: clamp(6px,2vw,16px); }

  .sub-label {
    position: absolute;
    top: clamp(10px,3vh,22px);
    color: rgba(255,255,255,.28);
    font-size: clamp(8px,1.3vh,11px);
    letter-spacing: .2em;
  }

  .ticks {
    display: flex; align-items: center; gap: clamp(6px,1.5vw,14px);
    color: rgba(255,176,32,.55);
    font-size: clamp(9px,1.6vh,14px);
    letter-spacing: .3em;
    margin-bottom: clamp(6px,2vh,18px);
  }
  .ticks .line { width: clamp(18px,5vw,50px); height: 1px; background: rgba(255,176,32,.35); }

  .pct {
    color: #f5f5f5;
    font-size: clamp(30px,9.5vh,78px);
    font-weight: 400;
    line-height: 1;
    text-shadow: 0 0 18px rgba(255,255,255,.18);
  }
  .pct .sign { color: rgba(255,176,32,.85); font-size: .5em; margin-left: .1em; }

  .bar-wrap {
    width: min(72vw, 480px);
    height: clamp(8px,1.8vh,14px);
    margin-top: clamp(12px,3.2vh,24px);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,176,32,.3);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c96c00, #ffb020);
    transition: width 1.2s ease;
  }

  .dday {
    margin-top: clamp(10px,3vh,22px);
    color: rgba(255,176,32,.9);
    font-size: clamp(16px,4vh,32px);
    letter-spacing: .08em;
  }

  .sub-row {
    display: flex; align-items: center; gap: clamp(10px,3vw,26px);
    margin-top: clamp(8px,2.2vh,16px);
    font-size: clamp(9px,1.6vh,13px);
    letter-spacing: .08em;
    color: rgba(255,255,255,.4);
    text-align: center;
  }
  .updated.stale { color: rgba(255,176,32,.6); }

  .brand {
    position: absolute;
    bottom: clamp(10px,3vh,22px);
    color: rgba(255,176,32,.7);
    font-size: clamp(9px,1.6vh,13px);
    letter-spacing: .4em;
    text-transform: uppercase;
  }

  @media (orientation: portrait) {
    .rotate-hint { display: flex; }
    .frame > *:not(.rotate-hint) { opacity: .12; }
  }
  .rotate-hint {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    color: rgba(255,176,32,.9);
    font-size: clamp(12px,3.4vw,16px);
    letter-spacing: .1em;
    text-align: center;
    padding: 0 10%;
    z-index: 5;
    background: rgba(0,0,0,.55);
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="bolt tl"></div>
    <div class="bolt tr"></div>
    <div class="bolt bl"></div>
    <div class="bolt br"></div>

    <div class="sub-label">NEXT HALVING PROGRESS</div>

    <div class="ticks"><span class="line"></span>BLOCK 840,000 → 1,050,000<span class="line"></span></div>

    <div class="pct" id="pct">--<span class="sign">%</span></div>

    <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>

    <div class="dday" id="dday">D-----</div>

    <div class="sub-row">
      <span id="estDate">예상 날짜 계산 중…</span>
      <span id="updated" class="updated">불러오는 중…</span>
    </div>

    <div class="brand">OWL BUTLER</div>

    <div class="rotate-hint">기기를 가로로 돌려주세요</div>
  </div>

<script>
(function(){
  var STORE_KEY = 'ob_standby_halving';
  var REFRESH_MS = 60000;
  var LAST_HALVING_BLOCK = 840000;
  var NEXT_HALVING_BLOCK = 1050000;
  var HALVING_INTERVAL = NEXT_HALVING_BLOCK - LAST_HALVING_BLOCK; // 210000
  var AVG_BLOCK_MINUTES = 10;

  var pctEl = document.getElementById('pct');
  var barFill = document.getElementById('barFill');
  var ddayEl = document.getElementById('dday');
  var estDateEl = document.getElementById('estDate');
  var updatedEl = document.getElementById('updated');

  function fmtTime(ts) {
    var d = new Date(ts);
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return hh + ':' + mm;
  }
  function fmtDate(d) {
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  function render(data, stale) {
    var pct = data.pct;
    pctEl.innerHTML = pct.toFixed(1) + '<span class="sign">%</span>';
    barFill.style.width = Math.min(100, Math.max(0, pct)) + '%';
    ddayEl.textContent = data.remainingDays <= 0 ? 'HALVING!' : ('D-' + Math.ceil(data.remainingDays));
    estDateEl.textContent = '예상 ' + fmtDate(new Date(data.estDateTs)) + ' (평균 10분/블록 기준)';
    updatedEl.textContent = (stale ? '마지막 확인 ' : '블록 ') + (stale ? fmtTime(data.ts) : data.height.toLocaleString('en-US'));
    updatedEl.className = 'updated' + (stale ? ' stale' : '');
  }

  function loadCache() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }
  function saveCache(data) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  function fetchHeight() {
    fetch('https://mempool.space/api/blocks/tip/height')
      .then(function(r){ if (!r.ok) throw new Error('bad status'); return r.text(); })
      .then(function(text){
        var height = parseInt(text, 10);
        if (!height || isNaN(height)) throw new Error('bad height');
        var pct = Math.min(100, Math.max(0, (height - LAST_HALVING_BLOCK) / HALVING_INTERVAL * 100));
        var remainingBlocks = Math.max(0, NEXT_HALVING_BLOCK - height);
        var remainingMinutes = remainingBlocks * AVG_BLOCK_MINUTES;
        var remainingDays = remainingMinutes / 1440;
        var estDateTs = Date.now() + remainingMinutes * 60000;
        var data = { height: height, pct: pct, remainingDays: remainingDays, estDateTs: estDateTs, ts: Date.now() };
        saveCache(data);
        render(data, false);
      })
      .catch(function(){
        var cached = loadCache();
        if (cached) render(cached, true);
        else { updatedEl.textContent = '블록 정보 불러오기 실패'; }
      });
  }

  var cached = loadCache();
  if (cached) render(cached, true);
  fetchHeight();
  setInterval(fetchHeight, REFRESH_MS);
})();
</script>
</body>
</html>
