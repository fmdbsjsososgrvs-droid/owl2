<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRRECEIVER</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #fdf4e7;
    --card: #fdf4e7;
    --white: #ffffff;
    --mono-bg: #fbeedd;
    --ink: #1a1208;
    --muted: #7a6040;
    --muted2: #a08060;
    --accent: #e07b0a;
    --accent-text: #ffffff;
    --border: rgba(224, 123, 10, 0.32);
    --green: #3a9a3a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Share Tech Mono", Menlo, Consolas, "Courier New", monospace;
    background: var(--bg); color: var(--ink);
    margin: 0; padding: 0 16px 40px;
    line-height: 1.55;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { padding: 32px 0 8px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent); margin: 0 0 6px;
  }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: 3px;
    margin: 0; color: var(--ink); text-transform: uppercase;
  }
  h1 span { color: var(--accent); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    text-align: left; padding: 22px 24px; margin: 20px 0;
  }
  label {
    display: block; margin: 16px 0 6px; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
  }
  label:first-child { margin-top: 0; }

  video, canvas.preview {
    width: 100%; background: #000; display: block;
    border: 1px solid var(--border); border-radius: 2px;
  }
  #camWrap { position: relative; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .btnrow { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1; font-family: inherit; font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; padding: 16px 12px; cursor: pointer;
    background: var(--card); color: var(--ink); border: 1px solid var(--border);
    border-radius: 2px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
  button.primary:hover:not(:disabled) { background: var(--accent); opacity: .88; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { background: var(--card); color: var(--muted2); cursor: default; opacity: .6; }

  #status {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin: 4px 2px;
  }
  #progressBarOuter {
    background: var(--white); border: 1px solid var(--border); border-radius: 2px;
    height: 10px; margin: 6px 2px 0; overflow: hidden;
  }
  #progressBarInner { background: var(--accent); height: 100%; width: 0%; transition: width .2s; }
  #missing { font-size: 12px; color: var(--muted2); margin: 6px 2px 0; word-break: break-all; }

  .resultCard {
    background: var(--card); border: 1px solid var(--border); border-top: 2px solid var(--green);
    border-radius: 2px;
    padding: 20px; margin: 18px 0; text-align: left; display: none;
  }
  .resultCard.show { display: block; }
  .resultCard .fname { font-size: 15px; font-weight: bold; word-break: break-all; }
  .resultCard .fmeta { font-size: 12px; color: var(--muted); margin: 6px 0 14px; }
  .resultCard img { max-width: 100%; border: 1px solid var(--border); border-radius: 2px; margin-bottom: 14px; }
  a.dl {
    display: block; text-align: center; padding: 14px; text-decoration: none;
    background: var(--accent); color: var(--accent-text); font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; font-size: 13px;
    border-radius: 2px;
  }
  a.dl:hover { opacity: .88; }

  .hint {
    font-size: 12px; line-height: 1.6; color: var(--muted);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Share Tech Mono", Menlo, Consolas, "Courier New", monospace;
    padding-top: 6px;
  }
  footer {
    margin-top: 32px; padding: 20px 4px 0; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">// SECURE TRANSFER</div>
  <h1>QR<span>RECEIVER</span></h1>
</header>

<div class="card">
  <label>Camera</label>
  <div id="camWrap">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="btnrow">
    <button id="startBtn" class="primary">▶ Start Scan</button>
    <button id="stopBtn" disabled>■ Stop</button>
  </div>
  <div id="status">카메라 시작 버튼을 눌러줘</div>
  <div id="progressBarOuter"><div id="progressBarInner"></div></div>
  <div id="missing"></div>
</div>

<div class="resultCard" id="resultCard">
  <div class="fname" id="resFname"></div>
  <div class="fmeta" id="resMeta"></div>
  <img id="resImg" style="display:none">
  <a class="dl" id="resLink" download>⬇ 파일 저장하기</a>
</div>

<p class="hint">송신 화면(다른 아이폰/맥북의 QRSENDER)을 카메라에 비춰줘. 여러 조각을 자동으로 모아서 재조립해. 완료되면 아래 저장 버튼으로 사진 앨범이나 파일 앱에 저장할 수 있어.</p>

<footer>
  <div>QR FILE TRANSFER</div>
  <div>AIR-GAPPED · CLIENT-SIDE ONLY</div>
</footer>
</div>

<script>
let stream = null;
let scanning = false;
let rafId = null;
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let totalChunks = null, crcExpected = null, filename = null, gotChunks = {};
let lastScanTime = 0;
const SCAN_INTERVAL_MS = 150;

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const progressInner = document.getElementById('progressBarInner');
const missingEl = document.getElementById('missing');
const resultCard = document.getElementById('resultCard');

function crc32(bytes) {
  let table = crc32.table;
  if (!table) {
    table = crc32.table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return ((crc ^ 0xFFFFFFFF) >>> 0);
}

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function guessMime(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = {
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
    webp: 'image/webp', heic: 'image/heic', pdf: 'application/pdf',
    txt: 'text/plain', json: 'application/json'
  };
  return map[ext] || 'application/octet-stream';
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
  } catch (e) {
    statusEl.textContent = '카메라 권한 오류: ' + e.message;
    return false;
  }
  video.srcObject = stream;
  await video.play();
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  return true;
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if (rafId) cancelAnimationFrame(rafId);
  octx.clearRect(0, 0, overlay.width, overlay.height);
}

function updateProgress() {
  if (!totalChunks) return;
  const have = Object.keys(gotChunks).length;
  progressInner.style.width = Math.round((have / totalChunks) * 100) + '%';
  const missing = [];
  for (let i = 1; i <= totalChunks; i++) if (!(i in gotChunks)) missing.push(i);
  statusEl.textContent = `진행: ${have}/${totalChunks} 조각 받음`;
  missingEl.textContent = (missing.length && missing.length <= 20) ? ('남음: ' + missing.join(',')) : '';
}

function handleDecoded(text) {
  if (text.startsWith('QRF1H|')) {
    const parts = text.split('|');
    if (parts.length < 4) return;
    const tc = parseInt(parts[1], 10);
    const crcHex = parts[2];
    const fnameB64 = parts.slice(3).join('|');
    let fname;
    try { fname = decodeURIComponent(escape(atob(fnameB64))); } catch (e) { return; }
    if (totalChunks === null) {
      totalChunks = tc; crcExpected = crcHex; filename = fname;
      statusEl.textContent = `헤더 인식됨: ${filename} (${totalChunks}조각)`;
    }
  } else if (text.startsWith('QRF1D|')) {
    const firstSep = text.indexOf('|', 6);
    if (firstSep === -1) return;
    const idx = parseInt(text.slice(6, firstSep), 10);
    const data = text.slice(firstSep + 1);
    if (!(idx in gotChunks)) gotChunks[idx] = data;
  }
  updateProgress();

  if (totalChunks && Object.keys(gotChunks).length === totalChunks) {
    finishTransfer();
  }
}

function finishTransfer() {
  let full = '';
  for (let i = 1; i <= totalChunks; i++) full += gotChunks[i];
  let bytes;
  try {
    bytes = base64ToBytes(full);
  } catch (e) {
    statusEl.textContent = 'base64 디코딩 실패, 계속 스캔 중...';
    return;
  }
  const crcActual = crc32(bytes).toString(16).padStart(8, '0');
  if (crcActual !== crcExpected) {
    statusEl.textContent = `체크섬 불일치 (기대 ${crcExpected}, 실제 ${crcActual}) — 계속 스캔 중...`;
    return;
  }

  scanning = false;
  stopCamera();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = `✅ 완료: ${filename} (${bytes.length.toLocaleString()} bytes)`;

  const mime = guessMime(filename);
  const blob = new Blob([bytes], { type: mime });
  const url = URL.createObjectURL(blob);

  document.getElementById('resFname').textContent = filename;
  document.getElementById('resMeta').textContent = `${bytes.length.toLocaleString()} bytes · 체크섬 일치 · ${mime}`;
  const link = document.getElementById('resLink');
  link.href = url;
  link.download = filename;

  const img = document.getElementById('resImg');
  if (mime.startsWith('image/') && mime !== 'image/heic') {
    img.src = url;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
  resultCard.classList.add('show');
}

function scanLoop(timestamp) {
  if (!scanning) return;
  if (timestamp - lastScanTime >= SCAN_INTERVAL_MS && video.videoWidth > 0) {
    lastScanTime = timestamp;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (code) {
      octx.strokeStyle = '#f5a623';
      octx.lineWidth = 4;
      const l = code.location;
      octx.beginPath();
      octx.moveTo(l.topLeftCorner.x, l.topLeftCorner.y);
      octx.lineTo(l.topRightCorner.x, l.topRightCorner.y);
      octx.lineTo(l.bottomRightCorner.x, l.bottomRightCorner.y);
      octx.lineTo(l.bottomLeftCorner.x, l.bottomLeftCorner.y);
      octx.closePath();
      octx.stroke();
      if (code.data.startsWith('QRF1')) {
        handleDecoded(code.data);
      }
    }
  }
  rafId = requestAnimationFrame(scanLoop);
}

startBtn.onclick = async () => {
  totalChunks = null; crcExpected = null; filename = null; gotChunks = {};
  progressInner.style.width = '0%';
  missingEl.textContent = '';
  resultCard.classList.remove('show');
  startBtn.disabled = true;
  const ok = await startCamera();
  if (!ok) { startBtn.disabled = false; return; }
  stopBtn.disabled = false;
  scanning = true;
  statusEl.textContent = '스캔 중... QR을 카메라에 비춰줘';
  rafId = requestAnimationFrame(scanLoop);
};

stopBtn.onclick = () => {
  scanning = false;
  stopCamera();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = '중단됨';
};
</script>
</body>
</html>
