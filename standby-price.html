<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>BTC/USD STANDBY | OWL BUTLER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
  }
  .frame {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 100vw; max-height: 100vh;
    background: radial-gradient(120% 140% at 50% 0%, #141414 0%, #060606 60%, #020202 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid rgba(255,176,32,.35);
    overflow: hidden;
  }
  .bolt {
    position: absolute; width: clamp(8px,2vw,14px); height: clamp(8px,2vw,14px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #444, #111 70%);
    border: 1px solid rgba(255,255,255,.12);
  }
  .bolt.tl { top: clamp(6px,2vh,16px); left: clamp(6px,2vw,16px); }
  .bolt.tr { top: clamp(6px,2vh,16px); right: clamp(6px,2vw,16px); }
  .bolt.bl { bottom: clamp(6px,2vh,16px); left: clamp(6px,2vw,16px); }
  .bolt.br { bottom: clamp(6px,2vh,16px); right: clamp(6px,2vw,16px); }

  .ticks {
    display: flex; align-items: center; gap: clamp(6px,1.5vw,14px);
    color: rgba(255,176,32,.55);
    font-size: clamp(9px,1.6vh,14px);
    letter-spacing: .3em;
    margin-bottom: clamp(6px,2vh,18px);
  }
  .ticks .line { width: clamp(18px,5vw,50px); height: 1px; background: rgba(255,176,32,.35); }

  .label {
    color: rgba(255,176,32,.85);
    font-size: clamp(11px,2.2vh,18px);
    letter-spacing: .35em;
    text-transform: uppercase;
    margin-bottom: clamp(4px,1.4vh,10px);
  }

  .price {
    color: #f5f5f5;
    font-size: clamp(32px,10vh,84px);
    font-weight: 400;
    letter-spacing: .02em;
    line-height: 1;
    text-shadow: 0 0 18px rgba(255,255,255,.18);
    white-space: nowrap;
  }
  .price .cur { color: rgba(255,176,32,.85); font-size: .5em; vertical-align: middle; margin-right: .25em; }

  .chart-wrap {
    width: min(78vw, 520px);
    height: clamp(28px,9vh,64px);
    margin-top: clamp(8px,2.4vh,20px);
  }
  .chart-wrap svg { width: 100%; height: 100%; display: block; }

  .sub-row {
    display: flex; align-items: center; gap: clamp(10px,3vw,26px);
    margin-top: clamp(8px,2.4vh,18px);
    font-size: clamp(10px,1.8vh,15px);
    letter-spacing: .12em;
  }
  .change { color: #8fd694; }
  .change.down { color: #e0645a; }
  .updated { color: rgba(255,255,255,.4); }
  .updated.stale { color: rgba(255,176,32,.6); }

  .brand {
    position: absolute;
    bottom: clamp(10px,3vh,22px);
    color: rgba(255,176,32,.7);
    font-size: clamp(9px,1.6vh,13px);
    letter-spacing: .4em;
    text-transform: uppercase;
  }

  .sub-label {
    position: absolute;
    top: clamp(10px,3vh,22px);
    color: rgba(255,255,255,.28);
    font-size: clamp(8px,1.3vh,11px);
    letter-spacing: .2em;
  }

  @media (orientation: portrait) {
    .rotate-hint { display: flex; }
    .frame > *:not(.rotate-hint) { opacity: .12; }
  }
  .rotate-hint {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    color: rgba(255,176,32,.9);
    font-size: clamp(12px,3.4vw,16px);
    letter-spacing: .1em;
    text-align: center;
    padding: 0 10%;
    z-index: 5;
    background: rgba(0,0,0,.55);
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="bolt tl"></div>
    <div class="bolt tr"></div>
    <div class="bolt bl"></div>
    <div class="bolt br"></div>

    <div class="sub-label">MARKET PRICE OF BITCOIN</div>

    <div class="ticks"><span class="line"></span>BTC / USD<span class="line"></span></div>

    <div class="price" id="price"><span class="cur">$</span>----</div>

    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 300 60" preserveAspectRatio="none"></svg>
    </div>

    <div class="sub-row">
      <span class="change" id="change">--</span>
      <span class="updated" id="updated">불러오는 중…</span>
    </div>

    <div class="brand">OWL BUTLER</div>

    <div class="rotate-hint">기기를 가로로 돌려주세요</div>
  </div>

<script>
(function(){
  var STORE_KEY = 'ob_standby_btc';
  var REFRESH_MS = 60000;

  var priceEl = document.getElementById('price');
  var changeEl = document.getElementById('change');
  var updatedEl = document.getElementById('updated');
  var chartSvg = document.getElementById('chart');

  function fmtUSD(n) {
    return Math.round(n).toLocaleString('en-US');
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    return hh + ':' + mm;
  }

  function drawChart(points) {
    if (!points || points.length < 2) { chartSvg.innerHTML = ''; return; }
    var w = 300, h = 60, pad = 3;
    var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
    var range = (max - min) || 1;
    var stepX = (w - pad*2) / (points.length - 1);
    var coords = points.map(function(p, i){
      var x = pad + i*stepX;
      var y = pad + (h - pad*2) * (1 - (p - min)/range);
      return [x, y];
    });
    var linePath = 'M' + coords.map(function(c){ return c[0].toFixed(1)+','+c[1].toFixed(1); }).join(' L');
    var areaPath = linePath + ' L' + coords[coords.length-1][0].toFixed(1) + ',' + h + ' L' + coords[0][0].toFixed(1) + ',' + h + ' Z';
    var rising = points[points.length-1] >= points[0];
    var strokeColor = rising ? '#8fd694' : '#e0645a';
    chartSvg.innerHTML =
      '<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + strokeColor + '" stop-opacity="0.35"/>' +
      '<stop offset="100%" stop-color="' + strokeColor + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + areaPath + '" fill="url(#grad)" stroke="none"/>' +
      '<path d="' + linePath + '" fill="none" stroke="' + strokeColor + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';
  }

  function render(data, stale) {
    priceEl.innerHTML = '<span class="cur">$</span>' + fmtUSD(data.price);
    var chg = data.change;
    changeEl.textContent = (chg >= 0 ? '▲ ' : '▼ ') + Math.abs(chg).toFixed(2) + '%';
    changeEl.className = 'change' + (chg < 0 ? ' down' : '');
    updatedEl.textContent = (stale ? '마지막 확인 ' : '업데이트 ') + fmtTime(data.ts);
    updatedEl.className = 'updated' + (stale ? ' stale' : '');
    drawChart(data.points);
  }

  function loadCache() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }
  function saveCache(data) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {}
  }

  function sample(arr, n) {
    if (arr.length <= n) return arr;
    var out = [];
    var step = (arr.length - 1) / (n - 1);
    for (var i = 0; i < n; i++) out.push(arr[Math.round(i*step)]);
    return out;
  }

  var lastPoints = null;

  // 가벼운 엔드포인트로 가격/등락률만 우선 확보 (레이트리밋에 덜 걸림)
  function fetchCore() {
    fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true')
      .then(function(r){ if (!r.ok) throw new Error('bad status'); return r.json(); })
      .then(function(json){
        var btc = json.bitcoin;
        if (!btc || typeof btc.usd !== 'number') throw new Error('empty');
        var data = { price: btc.usd, change: btc.usd_24h_change || 0, points: lastPoints, ts: Date.now() };
        saveCache(data);
        render(data, false);
      })
      .catch(function(){
        var cached = loadCache();
        if (cached) render(cached, true);
        else { updatedEl.textContent = '가격 정보 불러오기 실패'; }
      });
  }

  // 차트용 시계열은 별도로, 더 낮은 빈도로 시도 (실패해도 가격 표시엔 영향 없음)
  function fetchChart() {
    fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=1')
      .then(function(r){ if (!r.ok) throw new Error('bad status'); return r.json(); })
      .then(function(json){
        var prices = json.prices || [];
        if (!prices.length) throw new Error('empty');
        lastPoints = sample(prices.map(function(p){ return p[1]; }), 60);
        drawChart(lastPoints);
        var cached = loadCache();
        if (cached) { cached.points = lastPoints; saveCache(cached); }
      })
      .catch(function(){ /* 차트는 실패해도 조용히 무시, 가격은 계속 표시됨 */ });
  }

  var cached = loadCache();
  if (cached) { lastPoints = cached.points; render(cached, true); }
  fetchCore();
  fetchChart();
  setInterval(fetchCore, REFRESH_MS);
  setInterval(fetchChart, REFRESH_MS * 5);
})();
</script>
</body>
</html>
