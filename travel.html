<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobby &amp; Travel | OWL BUTLER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdf4e7;
  --bg2: #faebd4;
  --border: rgba(224,123,10,.18);
  --border2: rgba(224,123,10,.32);
  --accent: #e07b0a;
  --accent2: #c96c00;
  --accent-lt: #f5a623;
  --text: #1a1208;
  --text2: #7a6040;
  --text3: #a08060;
  --mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
}
.site-nav{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:10px 5%;box-shadow:0 1px 12px rgba(224,123,10,.08);}
.site-nav .nav-logo{font-family:var(--mono);font-weight:400;font-size:.8rem;letter-spacing:.22em;color:var(--text);text-decoration:none;text-transform:uppercase;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:4px 0;border:none;}
.site-nav .nav-logo img{height:28px;width:28px;object-fit:cover;border-radius:3px;}
.site-nav .nav-menu{display:flex;align-items:center;list-style:none;gap:.2rem;margin:0;padding:0;}
.site-nav .nav-menu a{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--text2);padding:.45rem .9rem;border:1px solid transparent;transition:color .18s,border-color .18s,background .18s;}
.site-nav .nav-menu img.nav-icon{height:16px;width:auto;vertical-align:middle;display:block;}
.site-nav .nav-menu a:hover{color:var(--accent2);border-color:var(--border2);background:rgba(224,123,10,.06);}
.site-nav .nav-menu a.active{color:#fff;background:var(--accent);border-color:var(--accent);}
@media (max-width:700px){
  .site-nav{padding:8px 5%;}
  .site-nav .nav-menu{display:flex !important;flex-wrap:wrap;width:100%;border-top:1px solid var(--border);padding-top:6px;margin-top:4px;gap:0;}
  .site-nav .nav-menu a{padding:.4rem .65rem;font-size:.72rem;}
}
.blog-head {
  padding: 48px 5% 28px;
  max-width: 860px;
  margin: 0 auto;
}
.blog-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.blog-title {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0.06em;
  margin: 0 0 10px;
}
.blog-desc {
  color: var(--text2);
  font-size: 14px;
  line-height: 1.7;
  margin: 0 0 28px;
}
.blog-search {
  position: relative;
  max-width: 420px;
}
.blog-search input {
  width: 100%;
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 11px 42px 11px 14px;
  font-family: 'IBM Plex Sans KR', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.blog-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(224,123,10,.12);
}
.blog-search svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--text3);
  pointer-events: none;
}
.blog-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
}
.blog-tag {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--text2);
  border: 1px solid var(--border2);
  border-radius: 999px;
  padding: 4px 12px;
  background: #fff;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.blog-tag:hover, .blog-tag.active {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
}
.blog-list {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 5% 80px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  align-items: stretch;
}
@media (max-width: 700px) {
  .blog-list { grid-template-columns: 1fr; }
}
.post-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  text-decoration: none;
  color: inherit;
  transition: border-color .35s, box-shadow .35s, transform .35s;
  z-index: 0;
}
.post-card:hover {
  border-color: var(--border2);
  box-shadow: 0 10px 28px rgba(224,123,10,.14);
  transform: translateY(-3px);
}
/* 컬러 워시: hover 시 은은한 오렌지-골드 그라데이션이 카드에 번지듯 퍼짐 */
.post-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(224,123,10,.14), rgba(245,166,35,.16) 45%, transparent 75%);
  opacity: 0;
  transform: scale(1.04);
  transition: opacity .5s ease, transform .5s ease;
  pointer-events: none;
  z-index: -1;
}
.post-card:hover::before {
  opacity: 1;
  transform: scale(1);
}
.post-main { flex: 1; min-width: 0; }
.post-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text3);
  margin-bottom: 8px;
}
.post-meta span { display: inline-flex; align-items: center; gap: 4px; }
.post-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 8px;
  line-height: 1.5;
}
.post-excerpt {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.7;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-thumb {
  flex-shrink: 0;
  width: 96px;
  height: 96px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--bg2);
  border: 1px solid var(--border);
}
.blog-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 90px 20px;
  color: var(--text3);
}
.blog-empty .e-icon {
  font-size: 26px;
  color: var(--accent);
  margin-bottom: 14px;
}
.blog-empty .e-title {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  color: var(--text2);
  margin-bottom: 8px;
}
.blog-empty .e-sub {
  font-size: 12.5px;
  line-height: 1.7;
}
@media (max-width: 560px) {
  .blog-title { font-size: 26px; }
  .post-thumb { width: 72px; height: 72px; }
  .post-card { gap: 14px; }
}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="nav-logo" href="index.html">
    <img loading="lazy" decoding="async" src="cq_imgs/cq_001.jpg" alt="mark" />OWL BUTLER
  </a>
  <ul class="nav-menu">
    <li><a href="security.html"><img src="icon/shield-check.png" alt="SECURITY" class="nav-icon" /></a></li>
    <li><a href="travel.html" class="active"><img src="icon/sailboat.png" alt="TRAVEL" class="nav-icon" /></a></li>
    <li><a href="psbt.html"><img src="icon/pt.png" alt="PSBT" class="nav-icon" /></a></li>
    <li><a href="bitcoin.html"><img src="223.png" alt="BITCOIN" class="nav-icon" /></a></li>
    <li><a href="Bitcoin%20Adoption%20Atlas.html"><img src="earth.png" alt="ATLAS" class="nav-icon" /></a></li>
    <li><a href="coldcardq.html"><img src="bitcoin.png" alt="COLDCARDQ" class="nav-icon" /></a></li>
    <li><a href="btcgame.html"><img src="game.png" alt="GAME" class="nav-icon" /></a></li>
  </ul>
</nav>

<div class="blog-head">
  <div class="blog-eyebrow">// Hobby &amp; Travel</div>
  <h1 class="blog-title">HOBBY &amp; TRAVEL</h1>
  <p class="blog-desc">취미, 여행, 삶에 대한 기록.</p>
  <div class="blog-search">
    <input type="text" id="blogSearch" placeholder="검색" autocomplete="off" />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
  <div class="blog-tags" id="blogTags"></div>
</div>

<!--
  POST CARD TEMPLATE (복사해서 .blog-list 안에 추가, 최신순으로 위에 삽입)
  data-title / data-tags 는 검색·태그 필터용 (JS가 읽음)

  <a class="post-card" href="travel-post-slug.html" data-title="글 제목" data-tags="태그1,태그2">
    <div class="post-main">
      <div class="post-meta"><span>2026-01-01</span></div>
      <p class="post-title">글 제목</p>
      <p class="post-excerpt">글 요약 1~2줄.</p>
    </div>
    <img class="post-thumb" src="썸네일.jpg" alt="" />
  </a>
-->
<div class="blog-list" id="blogList">
  <a class="post-card" href="travel-post-group.html" data-title="GROUP" data-tags="모임,TheBSociety,기록">
    <div class="post-main">
      <div class="post-meta"><span>2026-08-23</span></div>
      <p class="post-title">GROUP</p>
      <p class="post-excerpt">모임을 만든 지 1년, 신뢰와 유대감으로 다져진 시간과 우리의 상징을 새긴 카드에 대한 기록.</p>
    </div>
    <img class="post-thumb" src="img/thumbs/a9-thumb.jpg" alt="" />
  </a>
</div>

<script>
  document.getElementById('mobileNav')?.classList.remove('open');

  // 검색: post-card의 data-title / 본문 텍스트 매칭, 카드가 없으면 아무 동작 안 함
  const searchInput = document.getElementById('blogSearch');
  const blogList = document.getElementById('blogList');
  searchInput?.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    const cards = blogList.querySelectorAll('.post-card');
    cards.forEach(card => {
      const title = (card.dataset.title || card.querySelector('.post-title')?.textContent || '').toLowerCase();
      const excerpt = (card.querySelector('.post-excerpt')?.textContent || '').toLowerCase();
      const match = !q || title.includes(q) || excerpt.includes(q);
      card.style.display = match ? '' : 'none';
    });
  });

  // 태그 필터: #blogTags 안에 .blog-tag 버튼이 채워지면 자동으로 동작
  const tagWrap = document.getElementById('blogTags');
  tagWrap?.addEventListener('click', (e) => {
    const btn = e.target.closest('.blog-tag');
    if (!btn) return;
    tagWrap.querySelectorAll('.blog-tag').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    const tag = btn.dataset.tag;
    const cards = blogList.querySelectorAll('.post-card');
    cards.forEach(card => {
      const tags = (card.dataset.tags || '').split(',').map(s => s.trim());
      const match = !tag || tag === 'all' || tags.includes(tag);
      card.style.display = match ? '' : 'none';
    });
  });
</script>
</body>
