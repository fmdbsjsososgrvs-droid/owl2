    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,140,40,.025) 3px,rgba(255,140,40,.025) 4px);

  }

// 도시 사이에 가짜 노드들도 추가 (작은 점들)
function makeFillerNodes(seed=1){
  const rng = mulberry32(seed);
  const out=[];
  // 노드가 많은 지역에 더 많이 추가
  const hotspots=[
    {lat:40,lon:-95,r:18,n:60,region:"북미"},
    {lat:50,lon:10,r:14,n:50,region:"유럽"},
    {lat:35,lon:120,r:18,n:55,region:"아시아"},
    {lat:25,lon:80,r:10,n:25,region:"아시아"},
    {lat:-25,lon:135,r:12,n:15,region:"오세아니아"},
    {lat:-15,lon:-55,r:14,n:18,region:"남미"},
    {lat:0,lon:25,r:18,n:12,region:"아프리카"},
  ];
  hotspots.forEach((h,hi)=>{
    for(let i=0;i<h.n;i++){
      const a=rng()*Math.PI*2;
      const r=Math.sqrt(rng())*h.r;
      out.push({
        ko:null, en:null,
        lat:h.lat+Math.cos(a)*r*0.6,
        lon:h.lon+Math.sin(a)*r,
        region:h.region,
        weight:0,
        filler:true,
        id:`f${hi}_${i}`
      });
    }
  });
  return out;
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}

window.CITIES = CITIES;
window.makeFillerNodes = makeFillerNodes;

// 3D 지구본 — Three.js
// 검은 구체 + 대륙 외곽선 (procedural) + 노드 점 + 베지어 연결 호

const { useEffect, useRef, useState, useImperativeHandle, forwardRef } = React;

// 위경도 → 3D 좌표
function llToVec3(lat, lon, r=1){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta),
  );
}

// 두 점 사이 베지어 호 (지구 위로 떠오르는 곡선)
// lift는 거리에 비례, 최소 lift 보장 — 그렇지 않으면 짧은 호가 지구 안으로 파고듦
function arcPoints(a, b, segs=48, lift=0.35){
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dist = a.distanceTo(b);
  const r = a.length();
  // 최소 lift 0.06, 거리에 따라 추가 lift
  const liftAmt = r + Math.max(0.06, lift * dist);
  mid.normalize().multiplyScalar(liftAmt);
  const pts=[];
  const minR = r; // 시작/끝점 반지름 = 표면 + 1%
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    // 쿼드러틱 베지어
    const p = new THREE.Vector3()
      .addScaledVector(a, (1-t)*(1-t))
      .addScaledVector(mid, 2*(1-t)*t)
      .addScaledVector(b, t*t);
    // 베지어가 지구 안으로 파고들지 않도록 최소 반지름 보장
    if(p.length() < minR){
      p.normalize().multiplyScalar(minR);
    }
    pts.push(p);
  }
  return pts;
}

        map: makeGlowTexture(),
        color: 0xffa346,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const sp = new THREE.Sprite(mat);
      sp.position.copy(pos).multiplyScalar(1.005);
      sp.scale.set(0.04, 0.04, 1);
      ringExpandGroup.add(sp);
      if(!stateRef.current.expandMeta) stateRef.current.expandMeta = [];
      stateRef.current.expandMeta.push({ mesh: sp, t: 0, duration: 1.0 });
    }

    function frame(){
      raf=requestAnimationFrame(frame);
      const now = performance.now();
      const dt = Math.min(0.05, (now-t0)/1000);
      t0=now;

      // 자동 회전
      if(propsRef.current.autoRotate && !dragState.dragging){
        targetRotY += (propsRef.current.rotateSpeed ?? 0.05) * dt;
      }

      // smoothing
      curRotY += (targetRotY-curRotY)*0.12;
      curRotX += (targetRotX-curRotX)*0.12;
      cameraDist += (targetDist-cameraDist)*0.12;
      globe.rotation.y = curRotY;
      globe.rotation.x = curRotX;
      camera.position.z = cameraDist;

      // 글로우 강도
      // 후광 스프라이트 강도 (모듈 스코프 변수가 클로저로 잡혀 있음)

      // 펄스 업데이트
      const pulseMeta = stateRef.current.pulseMeta || [];
      pulseMeta.forEach(p=>{
        const wasAlive = !p.dead;
        p.t += dt / p.duration;
        if(p.t>=1){
          p.t = 1;
          if(wasAlive && !p.dead){
            // 도착 — ring expand 2개 (시간차)
            const endPt = p.points[p.points.length-1];
            spawnRingExpand(endPt);
            setTimeout(()=>spawnRingExpand(endPt), 180);
          }
          p.dead=true;
        }
        const i = Math.min(p.points.length-1, Math.floor(p.t*p.points.length));
        const pt = p.points[i];
        p.mesh.position.copy(pt);
        p.mesh.material.opacity = (1 - p.t)*0.95;
      });

      // ring expand 업데이트
      const expandMeta = stateRef.current.expandMeta || [];
      stateRef.current.expandMeta = expandMeta.filter(e=>{
        e.t += dt / e.duration;
        if(e.t >= 1){
          ringExpandGroup.remove(e.mesh);
          e.mesh.material.dispose();
          return false;
        }
        const scale = 0.04 + e.t * 0.18;
        e.mesh.scale.set(scale, scale, 1);
        e.mesh.material.opacity = (1 - e.t) * 0.9;
        return true;
      });

      // 노드 펄스 애니
      const meta = stateRef.current.nodeMeta || [];
      const time = now*0.001;
      meta.forEach(m=>{
        // 노드 크기 고정 — 펄스 애니 없음
        m.mesh.scale.setScalar(1);
        if(m.glow){
          m.glow.scale.setScalar(1);
          m.glow.material.opacity = 0;
        }
      });

      renderer.render(scene, camera);
    }
    frame();

    stateRef.current = {
      scene, camera, renderer, globe, R,
      nodesGroup, arcsGroup, pulsesGroup,
      nodeMeta: [],
      arcMeta: [],
      pulseMeta: [],
      expandMeta: [],
    };
    window.__globeDbg = stateRef.current;

    return ()=>{
      cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener('resize', resize);
      mount.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      mount.removeEventListener('wheel', onWheel);
      mount.removeEventListener('click', handleClick);
      renderer.dispose();
      mount.removeChild(renderer.domElement);
    };
  }, []);

  // 노드 동기화
  useEffect(()=>{
    const st = stateRef.current;
    if(!st.nodesGroup) return;
    // 클리어
    while(st.nodesGroup.children.length){
      const c = st.nodesGroup.children.pop();
      c.geometry?.dispose?.();
      c.material?.dispose?.();
    }
    const meta=[];
    nodes.forEach(node=>{
      const v = llToVec3(node.lat, node.lon, st.R*1.012);
      // 모든 도시 노드: 작은 고정 크기
      const isCity = !node.filler;
      const size = 0.012;
      const color = 0xff8a30;

      const geom = new THREE.SphereGeometry(size, 12, 12);
      const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity: isCity?1:0.7, depthWrite:true, depthTest:true });
      const m = new THREE.Mesh(geom, mat);
      m.position.copy(v);
      m.renderOrder = 2;
      st.nodesGroup.add(m);

      let glow = null;
      // 글로우 후광 제거 — 노드는 작은 단단한 점으로만 표시

      meta.push({ node, mesh:m, glow, phase: Math.random()*Math.PI*2 });
    });
    st.nodeMeta = meta;
  }, [nodes]);

  // 호 동기화
  useEffect(()=>{
    const st = stateRef.current;
    if(!st.arcsGroup) return;
    while(st.arcsGroup.children.length){
      const c = st.arcsGroup.children.pop();
      c.geometry?.dispose?.();
      c.material?.dispose?.();
    }
    arcs.forEach(arc=>{
      const a = llToVec3(arc.from.lat, arc.from.lon, st.R*1.01);
      const b = llToVec3(arc.to.lat, arc.to.lon, st.R*1.01);
      const pts = arcPoints(a,b, 64, 0.25);

      // 진한 메인 라인
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({
        color: arc.color || 0xff8a30,
        transparent:true,
        opacity: (arc.opacity ?? 0.7) * (propsRef.current.arcOpacity ?? 1),
        depthTest:true,
        depthWrite:false,
        blending: THREE.AdditiveBlending,
      });
      const line = new THREE.Line(g, mat);
      line.renderOrder = 3;
      st.arcsGroup.add(line);
    });
    st.arcMeta = arcs;
  }, [arcs, arcOpacity]);

  // 펄스 동기화 (펄스는 일회성)
  useEffect(()=>{
    const st = stateRef.current;
    if(!st.pulsesGroup) return;
    pulses.forEach(p=>{
      // 이미 추가되었는지 체크
      if(p._added) return;
      p._added = true;
      const a = llToVec3(p.from.lat, p.from.lon, st.R*1.005);
      const b = llToVec3(p.to.lat, p.to.lon, st.R*1.005);
      const pts = arcPoints(a,b, 64, 0.22);
      const mat = new THREE.SpriteMaterial({
        map: makeGlowTexture(),
        color: 0xffd080,
        transparent:true,
        opacity:0.7,
        blending: THREE.AdditiveBlending,
        depthWrite:false,
        depthTest:true,
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(0.04,0.04,1);
      st.pulsesGroup.add(sprite);
      st.pulseMeta.push({ mesh:sprite, points:pts, t:0, duration:1.5+Math.random()*0.8, dead:false });
    });
    // 죽은 펄스 정리
    st.pulseMeta = st.pulseMeta.filter(pm=>{
      if(pm.dead){
        st.pulsesGroup.remove(pm.mesh);
        pm.mesh.material.dispose();
      }
      return !pm.dead;
    });
  });

  return <div ref={mountRef} style={{position:'absolute',inset:0,zIndex:1}} />;
});

// 글로우 텍스처
let _glowTex = null;
function makeGlowTexture(){
  if(_glowTex) return _glowTex;
  const c = document.createElement('canvas');
  c.width=128; c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0, 'rgba(255,200,120,1)');
  g.addColorStop(0.3, 'rgba(255,140,40,0.6)');
  g.addColorStop(1, 'rgba(255,100,20,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,128,128);
  _glowTex = new THREE.CanvasTexture(c);
  return _glowTex;
}

window.Globe3D = Globe3D;
window.llToVec3 = llToVec3;

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel" data-presets="env,react">

const { useState, useEffect, useRef, useMemo } = React;

// 접기 버튼 — 패널 우상단에 [-]/[+] 토글
function CollapseBtn({ collapsed, onToggle }){
  return (
    <button
      onClick={onToggle}

      style={{
        position:'absolute', top:8, right:8, zIndex:2,

        fontSize:14, lineHeight:'18px', fontWeight:600,
        cursor:'pointer',

      }}
      onMouseEnter={e=>{ e.currentTarget.style.color='var(--orange-bright)'; e.currentTarget.style.borderColor='var(--orange-bright)'; }}
      onMouseLeave={e=>{ e.currentTarget.style.color='var(--ink-dim)'; e.currentTarget.style.borderColor='var(--panel-line)'; }}
    >{collapsed?'+':'−'}</button>
  );
}

// 패널 collapse 상태 (localStorage에 저장)
function usePanelCollapse(key, defaultCollapsed=false){
  const [collapsed, setCollapsed] = useState(()=>{
    try {
      const v = localStorage.getItem('panel-'+key);
      if(v===null) return defaultCollapsed;
      return v==='1';
    } catch(e){ return defaultCollapsed; }
  });
  const toggle = () => {
    setCollapsed(c=>{
      const next = !c;
      try { localStorage.setItem('panel-'+key, next?'1':'0'); } catch(e){}
      return next;
    });
  };
  return [collapsed, toggle];
}

// ─────────── 좌상단: 헤더 ───────────

function useTickClock(){

  return `${t.getUTCFullYear()}.${pad(t.getUTCMonth()+1)}.${pad(t.getUTCDate())} ${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:${pad(t.getUTCSeconds())}`;

  AU:'오세아니아',NZ:'오세아니아',
  BR:'남미',AR:'남미',CL:'남미',CO:'남미',PE:'남미',VE:'남미',
  ZA:'아프리카',NG:'아프리카',EG:'아프리카',KE:'아프리카',MA:'아프리카',
};

window.LiveData = {
  // 멤풀.스페이스 통합 fetch
  async fetchAll(){
    const [tip, hashrate, mempool, recentBlocks, mempoolTxs] = await Promise.all([
      safeJson(`${MEMPOOL}/blocks/tip/height`),         // 숫자 (text도 가능)
      safeJson(`${MEMPOOL}/v1/mining/hashrate/3d`),     // {currentHashrate, currentDifficulty, ...}
      safeJson(`${MEMPOOL}/mempool`),                   // {count, vsize, total_fee}
      safeJson(`${MEMPOOL}/v1/blocks`),                 // 최근 15개 블록
      safeJson(`${MEMPOOL}/mempool/recent`),            // 최근 mempool tx
    ]);

    return { tip, hashrate, mempool, recentBlocks, mempoolTxs };
  },

  // bitnodes는 무료 CORS 프록시로 받기엔 응답이 크고 느려서 사용 불가.
  // 대신 합리적 베이스라인(공개 통계 기준 reachable 노드 ~21,000) +
  // 시간에 따른 자연스러운 변동을 사용. 대륙 분포는 bitnodes.io 공개 통계 기반 고정 비율.
  fetchNodes(){
    const t = Date.now()/60000;
    const total = Math.round(20800 + Math.sin(t/30)*180 + (Math.random()-0.5)*40);
    const ratios = {
      '북미':0.359,'유럽':0.302,'아시아':0.181,
      '남미':0.041,'오세아니아':0.038,'아프리카':0.014,
    };
    const sumPart = Object.values(ratios).reduce((a,b)=>a+b,0);
    const others = Math.round(total*(1-sumPart));
    const regions = Object.entries(ratios).map(([name,r])=>({
      name, count: Math.round(total*r + (Math.random()-0.5)*20)
    })).sort((a,b)=>b.count-a.count);
    return Promise.resolve({ total: total+others, regions });
  },
};

</script>
<script type="text/babel" data-presets="env,react">
// 메인 앱 — 시뮬레이션 상태 + Globe + UI 조합
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const { Header, StatsBlock, RegionChart, FeedBlock, NodePopup, HoverTooltip, Compass } = window.UI;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "nodeCount": 220,
  "rotateSpeed": 0.05,
  "autoRotate": true,
  "arcOpacity": 1.0,
  "glowIntensity": 1.0,
  "newConnectionRate": 1.0,
  "showGrid": true
}/*EDITMODE-END*/;

function App(){
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

  // ─── 노드 풀 ───
  const allNodes = useMemo(()=>{
    const cities = window.CITIES.map((c,i)=>({...c, id:`c${i}`}));
    return cities;
  }, []);

  // ─── 활성 노드 (라이브 깜빡임) ───
  const [activeIds, setActiveIds] = useState(new Set());
  useEffect(()=>{
    const id = setInterval(()=>{
      setActiveIds(prev=>{
        const next = new Set(prev);
        // 일부 제거, 일부 추가
        const toRemove = [...next].slice(0, Math.floor(next.size*0.3));
        toRemove.forEach(x=>next.delete(x));
        const candidates = allNodes.filter(n=>n.weight>0);
        for(let i=0;i<6;i++){
          const c = candidates[Math.floor(Math.random()*candidates.length)];
          if(c) next.add(c.id);
        }
        return next;
      });
    }, 700);
    return ()=>clearInterval(id);
  }, [allNodes]);

  // ─── 연결선 (호) ───
  const [arcs, setArcs] = useState([]);
  useEffect(()=>{
    // 모든 노드 → 가장 가까운 N개씩 연결한 기본 네트워크 mesh
    const all = allNodes;
    const seen = new Set();
    const initial = [];
    all.forEach(a=>{
      const others = all.filter(c=>c!==a);
      others.sort((x,y)=> distLL(a,x) - distLL(a,y));
      // 가장 가까운 3개
      others.slice(0,3).forEach(b=>{
        const k = a.id<b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
        if(seen.has(k)) return;
        seen.add(k);
        initial.push({from:a, to:b, opacity:0.7, color:0xff8a30, key:k});
      });
    });
    // long-haul: 주요 도시(weight>=3) 사이 추가 연결
    const cities = all.filter(n=>n.weight>=3);
    cities.forEach((a,i)=>{
      const others = cities.filter(c=>c!==a);
      others.sort((x,y)=> distLL(a,x) - distLL(a,y));
      // 멀리 있는 도시 1-2개
      const longs = others.slice(Math.min(4, others.length-1), Math.min(8, others.length));
      longs.forEach(b=>{
        if(Math.random()<0.4){
          const k = a.id<b.id ? `${a.id}|${b.id}-l` : `${b.id}|${a.id}-l`;
          if(seen.has(k)) return;
          seen.add(k);
          initial.push({from:a, to:b, opacity:0.4, color:0xff8a30, key:k});
        }
      });
    });
    setArcs(initial);
  }, [allNodes]);

  // 주기적 호 추가/제거 — 비활성화 (정적 네트워크 mesh 유지, pulses로만 라이브 표현)

  // ─── 펄스 (호 위 빛) ───
  const [pulses, setPulses] = useState([]);
  useEffect(()=>{
    const id = setInterval(()=>{
      if(arcs.length===0) return;
      const arc = arcs[Math.floor(Math.random()*arcs.length)];
      setPulses(prev=>{
        const next = [...prev.slice(-30), {from:arc.from, to:arc.to, key:`p-${Date.now()}-${Math.random()}`}];
        return next;
      });
    }, Math.max(150, 600/Math.max(0.1,tweaks.newConnectionRate)));
    return ()=>clearInterval(id);
  }, [arcs, tweaks.newConnectionRate]);

  // ─── 라이브 통계 (실시간 mempool.space + bitnodes API) ───
  const [stats, setStats] = useState({
    totalNodes: 0,
    activeNodes: 0,
    blockHeight: 0,
    hashrate: '—',
    mempool: 0,
  });
  const [liveRegions, setLiveRegions] = useState(null);

  // mempool.space 폴링 (15초마다)
  useEffect(()=>{
    let cancelled = false;
    async function poll(){
      const data = await window.LiveData.fetchAll();
      if(cancelled || !data) return;
      const tip = typeof data.tip === 'number' ? data.tip : parseInt(data.tip);
      const hr = data.hashrate?.currentHashrate; // hashes/s
      const ehs = hr ? (hr / 1e18).toFixed(1) : '—';
      const mp = data.mempool;
      const mempoolMB = mp ? (mp.vsize / 1e6) : 0;

      setStats(s=>({
        ...s,
        blockHeight: tip || s.blockHeight,
        hashrate: ehs,
        mempool: mempoolMB || s.mempool,
        activeNodes: s.activeNodes,
      }));

      if(Array.isArray(data.recentBlocks) && data.recentBlocks.length){
        const now = Math.floor(Date.now()/1000);
        const newBlocks = data.recentBlocks.slice(0,13).map(b=>({
          height: b.height,
          hash: b.id,
          txs: b.tx_count,
          size: ((b.size||0)/1e6).toFixed(2),
          age: ageFromTs(now - (b.timestamp||now)),
        }));
        setBlocks(newBlocks);
      }
      if(Array.isArray(data.mempoolTxs) && data.mempoolTxs.length){
        setTxs(data.mempoolTxs.slice(0,12).map(t=>({
          id: t.txid,
          amount: ((t.value||0)/1e8).toFixed(4),
          fee: t.vsize ? Math.round((t.fee||0)/t.vsize) : 0,
        })));
      }
    }
    poll();
    const id = setInterval(poll, 15000);
    return ()=>{ cancelled=true; clearInterval(id); };
  }, []);

  // bitnodes 폴링 (10분마다 — 새 스냅샷 주기)
  useEffect(()=>{
    let cancelled = false;
    async function poll(){
      const nodes = await window.LiveData.fetchNodes();
      if(cancelled || !nodes) return;
      setStats(s=>({
        ...s,
        totalNodes: nodes.total,
        activeNodes: nodes.total, // bitnodes는 reachable=active
      }));
      setLiveRegions(nodes.regions);
    }
    poll();
    const id = setInterval(poll, 10*60*1000);
    return ()=>{ cancelled=true; clearInterval(id); };
  }, []);

  // ─── 블록 / TX 피드 ───
  const [blocks, setBlocks] = useState(()=>[
    { height:925341, hash:'00000000000000000002a8e4b3c1d5e6f78901234567890abcdef12345678', txs:2341, size:'1.42', age:'방금' },
    { height:925340, hash:'00000000000000000003b7f2c1d5e6a78b01234567890fedcba12345678', txs:1893, size:'1.31', age:'8분 전' },
    { height:925339, hash:'0000000000000000000a8b3c2d1e5f67891234567890abcdef98765432', txs:2784, size:'1.49', age:'19분 전' },
    { height:925338, hash:'00000000000000000004c1b2a3d4e5f678912345678901234abcdef5678', txs:1567, size:'0.98', age:'27분 전' },
    { height:925337, hash:'000000000000000000056b3c2d1e4f67891234567890fedcba12abc678', txs:2102, size:'1.23', age:'34분 전' },
  ]);
  const [txs, setTxs] = useState(()=>genTxs(8));
  useEffect(()=>{
    const id = setInterval(()=>{
      setTxs(prev=>[genTx(), ...prev.slice(0,11)]);
    }, 1200);
    return ()=>clearInterval(id);
  }, []);

  // ─── 지역별 카운트 (bitnodes 라이브, 없으면 fallback) ───
  const regions = useMemo(()=>{
    if(liveRegions && liveRegions.length) return liveRegions;
    const weights = { '북미':4500, '유럽':4200, '아시아':2800, '남미':480, '오세아니아':520, '아프리카':190 };
    return Object.entries(weights).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  }, [liveRegions]);

  // ─── 호버/클릭 ───
  const [hoverNode, setHoverNode] = useState(null);
  const [hoverPos, setHoverPos] = useState({x:0,y:0});
  const [pickedNode, setPickedNode] = useState(null);

  const onHover = useCallback((node, x, y)=>{
    setHoverNode(node);
    setHoverPos({x:x||0, y:y||0});
  },[]);
  const onPick = useCallback((node)=>{
    setPickedNode(node);
  },[]);

  // ─── 펄스 정리 (지난 펄스 제거) ───
  useEffect(()=>{
    if(pulses.length>40){
      const id = setTimeout(()=>setPulses(p=>p.slice(-30)), 100);
      return ()=>clearTimeout(id);
    }
  }, [pulses]);

  return (
    <div style={{position:'fixed',inset:0,background:'#000'}}>
      <window.Globe3D
        nodes={allNodes}
        activeIds={activeIds}
        arcs={arcs}
        pulses={pulses}
        autoRotate={tweaks.autoRotate}
        rotateSpeed={tweaks.rotateSpeed}
        glow={tweaks.glowIntensity}
        arcOpacity={tweaks.arcOpacity}
        onHover={onHover}
        onPick={onPick}
      />
      <div className="vignette"></div>
      <div className="scanline"></div>

      <Header stats={stats} />
      <StatsBlock {...stats} />
      <RegionChart regions={regions} />
      <FeedBlock blocks={blocks} txs={txs} />
      <Compass />

      <HoverTooltip node={hoverNode} x={hoverPos.x} y={hoverPos.y} />
      {pickedNode && <NodePopup node={pickedNode} onClose={()=>setPickedNode(null)} />}

      {/* 좌표/구독자 안내 한 줄 */}
      <div style={{position:'absolute',bottom:6,left:'50%',transform:'translateX(-50%)',zIndex:10,fontSize:10,letterSpacing:'0.2em',color:'var(--ink-faint)',textTransform:'uppercase'}}>
        SATOSHI NAKAMOTO · PEER-TO-PEER ELECTRONIC CASH · 2009 — 2026
      </div>

      {/* Tweaks */}
      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="회전 & 시점">
          <window.TweakToggle label="자동 회전" value={tweaks.autoRotate} onChange={v=>setTweak('autoRotate',v)} />
          <window.TweakSlider label="회전 속도" value={tweaks.rotateSpeed} onChange={v=>setTweak('rotateSpeed',v)} min={0} max={0.3} step={0.01} />
        </window.TweakSection>
        <window.TweakSection title="노드 & 연결">
          <window.TweakSlider label="새 연결 빈도" value={tweaks.newConnectionRate} onChange={v=>setTweak('newConnectionRate',v)} min={0.2} max={3} step={0.1} />
          <window.TweakSlider label="연결선 투명도" value={tweaks.arcOpacity} onChange={v=>setTweak('arcOpacity',v)} min={0.2} max={1.5} step={0.05} />
        </window.TweakSection>
        <window.TweakSection title="비주얼">
          <window.TweakSlider label="글로우 강도" value={tweaks.glowIntensity} onChange={v=>setTweak('glowIntensity',v)} min={0} max={2.5} step={0.1} />
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

function distLL(a,b){
  const dx = a.lat-b.lat, dy=a.lon-b.lon;
  return Math.sqrt(dx*dx+dy*dy);
}
function genTx(){
  return {
    id: '0x'+Math.random().toString(16).slice(2,18)+Math.random().toString(16).slice(2,18),
    amount: (Math.random()*5).toFixed(4),
    fee: Math.floor(Math.random()*180)+8,
  };
}
function genTxs(n){ return Array.from({length:n},genTx); }
function ageStep(age){
  if(age==='방금') return '1분 전';
  const m = age.match(/(\d+)분/);
  if(m) return `${parseInt(m[1])+1}분 전`;
  return age;
}
function ageFromTs(secAgo){
  if(secAgo<60) return '방금';
  const m = Math.floor(secAgo/60);
  if(m<60) return `${m}분 전`;
  const h = Math.floor(m/60);
  return `${h}시간 전`;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
